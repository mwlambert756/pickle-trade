<style>
/* ============================= DESIGN TOKENS ============================= */
:root{
  /* Type — Inter variable with a real fallback chain. Nothing renders in a serif. */
  --font-ui:'Inter','Inter var',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  /* Motion — one spring for entrances, one ease for state, one snap for taps. */
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --ease-out:cubic-bezier(.22,.61,.36,1);
  --ease-in-out:cubic-bezier(.65,0,.35,1);
  --dur-1:120ms;   /* taps, hovers */
  --dur-2:200ms;   /* state changes */
  --dur-3:320ms;   /* sheets, overlays */
  /* Elevation — a real ramp instead of ad-hoc shadows */
  --sh-1:0 1px 2px rgba(16,24,40,.05);
  --sh-2:0 2px 8px rgba(16,24,40,.07),0 1px 2px rgba(16,24,40,.04);
  --sh-3:0 8px 24px rgba(16,24,40,.10),0 2px 6px rgba(16,24,40,.05);
  --sh-4:0 20px 48px rgba(16,24,40,.16),0 6px 14px rgba(16,24,40,.07);
}

*{box-sizing:border-box;margin:0;padding:0}

/* ============================== TYPOGRAPHY ==============================
   The app previously declared no font-family at all, so every screen
   inherited the browser default (a serif). This is the fix. */
html,body,#root{
  font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  font-synthesis-weight:none;
  height:100%;
  overflow:hidden;
}
/* The frame below is sized to exactly match the viewport, so the outer
   document should never need to scroll. But 100dvh recalculates live as a
   mobile browser's address bar collapses/expands, and if the outer page is
   even ambiguously scrollable, a touch-scroll gesture inside a listing can
   get captured by the page (triggering that address-bar animation) instead
   of being handed to the listing's own inner scroll area — so the content
   never actually moves. Locking html/body/#root to overflow:hidden removes
   that ambiguity entirely: nothing above the app frame can ever scroll, so
   every gesture is unambiguously routed to whichever inner element (the
   listing's "sc" div) actually has overflow:auto and room to move. */

/* ============================ APP SHELL / FRAME ============================
   The app used to render into a hard-coded 380x780px box. On any window
   shorter than ~808px the bottom of that box — which is where the pinned
   Buy Now / Offer footer on a listing lives — fell outside the viewport, so
   the primary purchase action looked missing. The frame is now bounded by
   the real viewport instead of a fixed pixel height: it keeps the centered
   phone-card look on a roomy desktop window, shrinks to fit a short one, and
   goes edge-to-edge on an actual phone. Everything inside is already a flex
   column with its own scroll region, so shrinking the frame just shortens
   the scroll area — the header and footer stay pinned and visible. */
.app-stage{
  display:flex;
  justify-content:center;
  background:#E5E7EB;
  padding:14px 0;
  min-height:100vh;
  min-height:100dvh;
}
.app-frame{
  width:380px;
  height:780px;
  max-height:calc(100vh - 28px);
  max-height:calc(100dvh - 28px);
  border-radius:34px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  position:relative;
  box-shadow:var(--sh-4),0 0 0 1px rgba(16,24,40,.08);
  overscroll-behavior:contain;
}
/* Every inner scroll region (listing detail, saved list, messages, etc. —
   anything using overflowY:'auto') gets momentum scrolling on iOS and stops
   scroll-chaining so a swipe that runs out of content doesn't bounce the
   frame or the page behind it. Applying this to every descendant is safe —
   it's a no-op on elements that aren't themselves scrollable. */
.app-frame *{
  -webkit-overflow-scrolling:touch;
}
/* Phones and any narrow window: full-bleed, no wasted chrome, and the frame
   is exactly the visible viewport so nothing can sit below the fold. */
@media(max-width:430px){
  .app-stage{padding:0;min-height:100vh;min-height:100dvh}
  .app-frame{
    width:100%;
    max-width:100%;
    height:100vh;
    height:100dvh;
    max-height:none;
    border-radius:0;
    box-shadow:none;
  }
}
body{
  font-feature-settings:'cv05' 1,'cv08' 1,'cv11' 1,'ss01' 1; /* single-storey a/g, open 4, disambiguated I/l */
  letter-spacing:-0.011em;                                    /* Inter reads tight at UI sizes */
}
input,textarea,select,button{font-family:inherit;letter-spacing:inherit}
input::placeholder,textarea::placeholder{color:#9CA3AF}
/* Numerals never reflow mid-update: prices, counts, timestamps. */
.tnum,input[type=number]{font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1,'cv05' 1}

/* ================================ MOTION ================================ */
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes scaleIn{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes riseIn{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes typingDot{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-4px);opacity:1}}
@keyframes pulseRing{0%{transform:scale(.9);opacity:.7}70%{transform:scale(1.5);opacity:0}100%{opacity:0}}

/* Interactive surfaces get a physical press. Buttons feel like buttons. */
button{transition:transform var(--dur-1) var(--ease-out),background-color var(--dur-2) var(--ease-out),border-color var(--dur-2) var(--ease-out),color var(--dur-2) var(--ease-out),opacity var(--dur-2) var(--ease-out),box-shadow var(--dur-2) var(--ease-out)}
button:active:not(:disabled){transform:scale(.96)}
[data-press]{transition:transform var(--dur-1) var(--ease-out),box-shadow var(--dur-2) var(--ease-out),border-color var(--dur-2) var(--ease-out)}
[data-press]:active{transform:scale(.985)}
input,textarea,select{transition:border-color var(--dur-2) var(--ease-out),box-shadow var(--dur-2) var(--ease-out),background-color var(--dur-2) var(--ease-out)}

/* Staggered list entrance — items rise in sequence rather than snapping in. */
.stagger>*{animation:riseIn var(--dur-3) var(--ease-out) both}
.stagger>*:nth-child(1){animation-delay:0ms}
.stagger>*:nth-child(2){animation-delay:28ms}
.stagger>*:nth-child(3){animation-delay:56ms}
.stagger>*:nth-child(4){animation-delay:84ms}
.stagger>*:nth-child(5){animation-delay:112ms}
.stagger>*:nth-child(6){animation-delay:140ms}
.stagger>*:nth-child(7){animation-delay:168ms}
.stagger>*:nth-child(n+8){animation-delay:190ms}

.typing-dot{animation:typingDot 1.3s infinite var(--ease-in-out)}
.typing-dot:nth-child(2){animation-delay:.16s}
.typing-dot:nth-child(3){animation-delay:.32s}

/* ============================= ACCESSIBILITY ============================= */
:focus{outline:none}
:focus-visible{outline:2px solid #4DA8FF;outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:#CBD2DC;border-radius:2px}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  button:active:not(:disabled),[data-press]:active{transform:none}
}

// --- IMAGE COMPRESSION ---
// Resize/compress a File to a JPEG blob (max edge ~1280px, quality 0.82) before upload.
// Keeps storage costs low and uploads fast. Falls back to the original file on any error.
function compressImage(file,maxEdge=1280,quality=0.82){
  return new Promise((resolve)=>{
    try{
      if(!file||!file.type||!file.type.startsWith('image/'))return resolve(file);
      const img=new Image();const url=URL.createObjectURL(file);
      img.onload=()=>{
        URL.revokeObjectURL(url);
        let{width:w,height:h}=img;
        if(Math.max(w,h)>maxEdge){const s=maxEdge/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        cv.toBlob(b=>{
          if(!b)return resolve(file);
          resolve(new File([b],(file.name||'photo').replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'}));
        },'image/jpeg',quality);
      };
      img.onerror=()=>{URL.revokeObjectURL(url);resolve(file);};
      img.src=url;
    }catch{resolve(file);}
  });
}

// --- BROWSER NOTIFICATIONS (PWA-ready) ---
// Requests Notification permission and shows a local notification. A full Web Push
// pipeline also needs a service worker + VAPID server key (see SW registration below);
// this client layer degrades gracefully when those aren't present.
const pushPermGet=()=>{try{return (typeof Notification!=='undefined')?Notification.permission:'unsupported';}catch{return 'unsupported';}};
async function pushRequest(){
  try{
    if(typeof Notification==='undefined')return 'unsupported';
    if(Notification.permission==='granted')return 'granted';
    const p=await Notification.requestPermission();return p;
  }catch{return 'denied';}
}
function pushNotify(title,body,opts={}){
  try{
    if(typeof Notification==='undefined'||Notification.permission!=='granted')return;
    // Only surface OS notifications when the tab is hidden, to avoid double-notifying
    if(document.visibilityState==='visible'&&!opts.force)return;
    new Notification(title,{body,icon:opts.icon,tag:opts.tag,silent:!!opts.silent});
  }catch{}
}
// Register a service worker if one is reachable (no-op in the sandboxed viewer).
// In production, ship /sw.js alongside this file to enable installability + background push.
// PUSH.enabled gates the whole notification surface. It only flips true once a
// service worker actually registers AND a VAPID key is present — previously the
// Settings toggle could read "Enabled" while sw.js didn't exist and no push
// could ever arrive, which is worse than not offering it.
const PUSH={
  vapidPublicKey:'',   // paste the VAPID public key here to enable Web Push
  swReady:false,
  registration:null,
  get enabled(){return this.swReady&&!!this.vapidPublicKey;},
};
async function registerSW(){
  try{
    if(!('serviceWorker'in navigator))return null;
    if(location.protocol!=='https:'&&location.hostname!=='localhost')return null;
    const reg=await navigator.serviceWorker.register('sw.js');
    PUSH.swReady=true;PUSH.registration=reg;
    return reg;
  }catch(err){
    // sw.js not deployed or blocked (sandboxed iframe). Leave PUSH.enabled false
    // so the UI shows "unavailable" instead of promising notifications.
    PUSH.swReady=false;
    return null;
  }
}
function urlBase64ToUint8Array(b64){
  const pad='='.repeat((4-b64.length%4)%4);
  const raw=atob((b64+pad).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}
// Subscribe the browser to Web Push and persist the subscription so a server
// can deliver while the app is closed. Returns {ok, reason}.
async function pushSubscribe(userId){
  try{
    if(!PUSH.enabled)return{ok:false,reason:'unavailable'};
    const perm=await pushRequest();
    if(perm!=='granted')return{ok:false,reason:perm};
    const reg=PUSH.registration||await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.subscribe({
      userVisibleOnly:true,
      applicationServerKey:urlBase64ToUint8Array(PUSH.vapidPublicKey),
    });
    const json=sub.toJSON();
    if(typeof userId==='string'){
      await sb.from('push_subscriptions').upsert({
        user_id:userId,
        endpoint:json.endpoint,
        p256dh:json.keys&&json.keys.p256dh,
        auth:json.keys&&json.keys.auth,
      },{onConflict:'endpoint'});
    }
    track('push_subscribed',{});
    return{ok:true};
  }catch(err){return{ok:false,reason:'error'};}
}
async function pushUnsubscribe(userId){
  try{
    const reg=PUSH.registration||(navigator.serviceWorker&&await navigator.serviceWorker.ready);
    if(!reg)return{ok:true};
    const sub=await reg.pushManager.getSubscription();
    if(sub){
      const ep=sub.endpoint;
      await sub.unsubscribe();
      if(typeof userId==='string')await sb.from('push_subscriptions').delete().eq('endpoint',ep);
    }
    track('push_unsubscribed',{});
    return{ok:true};
  }catch{return{ok:false};}
}

// PHONE VERIFICATION
// Was a demo that granted the Verified badge for any 4 digits typed in.
// Now backed by Supabase Auth phone OTP. VERIFY.enabled must stay false
// until an SMS provider (Twilio/MessageBird) is configured on the project,
// otherwise the modal tells the user plainly that it isn't open yet.
// =====================================================================
const VERIFY={
  enabled:false,   // flip true once SMS is configured in Supabase Auth
  provider:'Supabase Auth (SMS OTP)',
};
function normalizePhone(digits){
  const d=String(digits||'').replace(/\D/g,'');
  if(d.length===10)return '+1'+d;
  if(d.length===11&&d[0]==='1')return '+'+d;
  return d.startsWith('+')?d:'+'+d;
}
async function verifySendCode(digits){
  if(!VERIFY.enabled)return{ok:false,message:'Phone verification isn\u2019t available yet.'};
  const rl=rateCheck('verify_send');
  if(rl.ok===false)return{ok:false,message:rl.message};
  try{
    const {error}=await sb.auth.updateUser({phone:normalizePhone(digits)});
    if(error)return{ok:false,message:error.message||'Could not send a code.'};
    rateRecord('verify_send');
    return{ok:true};
  }catch(err){return{ok:false,message:'Could not send a code. Check your connection.'};}
}
async function verifyCheckCode(digits,code){
  if(!VERIFY.enabled)return{ok:false,message:'Phone verification isn\u2019t available yet.'};
  try{
    const {error}=await sb.auth.verifyOtp({phone:normalizePhone(digits),token:String(code),type:'phone_change'});
    if(error)return{ok:false,message:error.message||'That code didn\u2019t match.'};
    return{ok:true};
  }catch(err){return{ok:false,message:'Verification failed. Try again.'};}
}

// --- PRICE HISTORY ---
// Reads real recorded price changes from the price_history table (migration
// 0005), which a trigger writes on every genuine price update.
//
// This replaces a version that synthesized the series in the browser from a
// seeded PRNG. A buyer reads that chart to decide whether to wait for another
// drop, so inventing it was making up evidence for someone else's purchase
// decision. A listing with no recorded changes now shows no chart at all,
// which is the honest answer for something posted yesterday.
async function fetchPriceHistory(listingId){
  if(typeof listingId!=='string')return [];
  try{
    const {data,error}=await sb.from('price_history')
      .select('price,changed_at')
      .eq('listing_id',listingId)
      .order('changed_at',{ascending:true})
      .limit(24);
    if(error||!data)return [];
    return data.map(r=>({price:Number(r.price),at:r.changed_at,label:timeAgo(r.changed_at)}));
  }catch{return [];}
}

  if(typeof u!=='string'||u.length>2048)return null;

    const url=new URL(u);
    if(url.protocol!=='https:')return null;
    if(!ALLOWED_PHOTO_HOSTS.has(url.host))return null;

  }catch{return null;}

// Strip control chars (incl. U+202E RTL override), cap length, collapse whitespace.
function sanitizeText(s,maxLen=2000){
  if(typeof s!=='string')return '';
  let out=s.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F\u202E]/g,'');
  out=out.replace(/[ \t]+/g,' ').trim();
  return out.slice(0,maxLen);
}
// Money validator — finite, non-negative, ≤ $100k, max 2 decimals.
function safeMoney(n){
  const v=Number(n);
  if(!Number.isFinite(v)||v<0||v>100000)return null;
  return Math.round(v*100)/100;
}
// Cash App / Venmo handle validators — prevent URL injection in deep-links.
function safeCashapp(s){const t=sanitizeText(s,30);return /^\$?[A-Za-z0-9_]{1,20}$/.test(t)?t:'';}
function safeVenmo(s){const t=sanitizeText(s,40);return /^@?[A-Za-z0-9_-]{1,30}$/.test(t)?t:'';}


// =====================================================================
// TRUST & SAFETY LAYER
// Reports, blocks, and disputes now persist. Previously each of these
// fired a toast and discarded the payload, which meant the app *looked*
// like it had moderation while offering none. Every write below goes to
// Supabase first; if that fails (offline, RLS, table not migrated yet)
// it lands in a local outbox and is retried on next app open, so a user
// report is never silently lost.
//
// Required tables (see MIGRATION.sql shipped alongside this file):
//   reports(id, reporter_id, target_type, target_id, target_owner_id,
//           reason, detail, status, created_at)
//   user_blocks(id, blocker_id, blocked_id, created_at) — this table already
//   existed in the project; we reuse it rather than create a duplicate
//   disputes(id, reporter_id, conversation_id, listing_ref, amount,
//            reason, detail, status, created_at)
// =====================================================================
const TS_OUTBOX_KEY='tsOutbox';
const outboxGet=()=>{const v=kv.get(TS_OUTBOX_KEY,[]);return Array.isArray(v)?v:[];};
const outboxPush=(table,row)=>{const q=outboxGet();q.push({table,row,at:Date.now()});kv.set(TS_OUTBOX_KEY,q.slice(-50));};
// Retry queued safety writes. Called once on sign-in; drops rows older than 30 days.
async function outboxFlush(){
  const q=outboxGet();if(!q.length)return;
  const cutoff=Date.now()-30*24*3600*1000;
  const keep=[];
  for(const item of q){
    if(item.at<cutoff)continue;
    try{
      const {error}=await sb.from(item.table).insert(item.row);
      if(error)keep.push(item);
    }catch{keep.push(item);}
  }
  kv.set(TS_OUTBOX_KEY,keep);
}

// =====================================================================
// CONTENT FILTER + RATE LIMITING
// Client-side is a speed bump, not a wall — the same rules must exist in
// a Postgres trigger / edge function. This catches the honest majority
// and gives immediate feedback instead of a silent server rejection.
// =====================================================================
const BANNED_PATTERNS=[
  /\b(?:cocaine|heroin|meth(?:amphetamine)?|fentanyl|oxycontin)\b/i,
  /\b(?:glock|ar-?15|ak-?47|handgun|silencer|ammo|ammunition)\b/i,
  /\b(?:stolen|hot merchandise|fell off (?:a|the) truck)\b/i,
  /\b(?:replica|knock ?off|counterfeit|1:1 copy|super fake)\b/i,
  /\b(?:ssn|social security number|routing number)\b/i,
];
const SPAM_PATTERNS=[
  /\b(?:wire transfer|western union|money ?gram|zelle only|gift card)\b/i,
  /\b(?:t\.me\/|wa\.me\/|whatsapp|telegram)\b/i,
  /(?:https?:\/\/|www\.)\S{4,}/i,
  /\b\d{3}[-.\s]?\d{3}[-.\s]?\d{4}\b/,
];
// Returns {blocked, warn, reason}. `blocked` stops the action; `warn` allows with a nudge.
function contentCheck(text,{allowLinks=false}={}){
  const t=String(text||'');
  if(!t.trim())return{blocked:false,warn:false};
  for(const re of BANNED_PATTERNS){
    if(re.test(t))return{blocked:true,warn:false,reason:'This looks like it violates our prohibited items policy.'};
  }
  let hits=0;
  for(const re of SPAM_PATTERNS){
    if(re===SPAM_PATTERNS[2]&&allowLinks)continue;
    if(re.test(t))hits++;
  }
  if(hits>=2)return{blocked:true,warn:false,reason:'Off-platform payment or contact details aren\u2019t allowed — keep deals in DINK so we can help if something goes wrong.'};
  if(hits===1)return{blocked:false,warn:true,reason:'Heads up: sharing contact details or outside payment links is risky and unprotected.'};
  // ALL-CAPS shouting / repeated char spam
  const letters=t.replace(/[^A-Za-z]/g,'');
  if(letters.length>=20&&letters===letters.toUpperCase())return{blocked:false,warn:true,reason:'All-caps listings get fewer views.'};
  return{blocked:false,warn:false};
}

// --- RATE LIMITING ---
// Sliding window per action, persisted so a refresh doesn't reset the clock.
const RL_KEY='rateLimits';
const RL_RULES={
  listing_create:{max:10,windowMs:3600e3,label:'listings'},
  offer_send:{max:25,windowMs:3600e3,label:'offers'},
  message_send:{max:120,windowMs:3600e3,label:'messages'},
  report_submit:{max:10,windowMs:86400e3,label:'reports'},
  review_submit:{max:15,windowMs:86400e3,label:'reviews'},
  verify_send:{max:5,windowMs:3600e3,label:'verification codes'},
};
function rateCheck(action){
  const rule=RL_RULES[action];if(!rule)return{ok:true};
  const all=kv.get(RL_KEY,{})||{};
  const now=Date.now();
  const hits=(all[action]||[]).filter(t=>now-t<rule.windowMs);
  if(hits.length>=rule.max){
    const oldest=Math.min(...hits);
    const mins=Math.max(1,Math.ceil((rule.windowMs-(now-oldest))/60000));
    return{ok:false,retryIn:mins,message:`You\u2019ve hit the limit for ${rule.label}. Try again in ${mins>60?Math.ceil(mins/60)+'h':mins+'m'}.`};
  }
  return{ok:true};
}
function rateRecord(action){
  const rule=RL_RULES[action];if(!rule)return;
  const all=kv.get(RL_KEY,{})||{};
  const now=Date.now();
  all[action]=[...(all[action]||[]).filter(t=>now-t<rule.windowMs),now];
  kv.set(RL_KEY,all);
}

// =====================================================================
// ANALYTICS + ERROR REPORTING
// Ships events to an `analytics_events` table in batches. Swap ANALYTICS.sink
// for PostHog/Amplitude/Segment without touching call sites. Respects a
// user opt-out and never records message bodies, listing text, or handles.
// =====================================================================
const ANALYTICS={
  enabled:true,
  flushEvery:15000,
  maxBatch:25,
};
let _evQueue=[];
let _sessionId=null;
function sessionId(){
  if(_sessionId)return _sessionId;
  _sessionId=kv.get('sessionId',null);
  if(!_sessionId){_sessionId='s'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);kv.set('sessionId',_sessionId);}
  return _sessionId;
}
let _analyticsUser=null;
const analyticsIdentify=(uid)=>{_analyticsUser=uid||null;};
const analyticsOptedOut=()=>kv.get('analyticsOptOut',false)===true;
function track(name,props){
  try{
    if(!ANALYTICS.enabled||analyticsOptedOut())return;
    _evQueue.push({
      name,
      props:props&&typeof props==='object'?props:{},
      user_id:typeof _analyticsUser==='string'?_analyticsUser:null,
      session_id:sessionId(),
      ts:new Date().toISOString(),
    });
    if(_evQueue.length>=ANALYTICS.maxBatch)flushEvents();
  }catch{}
}
async function flushEvents(){
  if(!_evQueue.length)return;
  const batch=_evQueue.splice(0,ANALYTICS.maxBatch);
  try{await sb.from('analytics_events').insert(batch);}
  catch{/* analytics must never break the app or block a user action */}
}
// Global error capture — surfaces crashes we'd otherwise never hear about.
function initErrorReporting(){
  try{
    window.addEventListener('error',(ev)=>{
      track('js_error',{message:String(ev.message||'').slice(0,300),source:String(ev.filename||'').slice(-80),line:ev.lineno||0});
    });
    window.addEventListener('unhandledrejection',(ev)=>{
      const r=ev&&ev.reason;
      track('js_rejection',{message:String((r&&r.message)||r||'').slice(0,300)});
    });
    setInterval(flushEvents,ANALYTICS.flushEvery);
    window.addEventListener('pagehide',()=>{flushEvents();});
  }catch{}
}

const followerCount=(uid)=>{const s=FOLLOW_GRAPH[uid];return s?s.size:0;};
// Mutual = people I follow who also follow this seller
const mutualCount=(uid)=>{
  const s=FOLLOW_GRAPH[uid];if(!s)return 0;
  let n=0;FOLLOWING.forEach(f=>{if(s.has(f))n++;});return n;
};
// People followed by people I follow, excluding me + already-followed
const suggestedIds=(followSet)=>{
  const F=followSet||FOLLOWING;
  const score={};
  F.forEach(f=>{
    Object.keys(FOLLOW_GRAPH).forEach(y=>{
      const yid=isNaN(+y)?y:+y;
      if(FOLLOW_GRAPH[y].has(f)&&yid!==0&&!F.has(yid))score[yid]=(score[yid]||0)+1;
    });
  });
  return Object.entries(score).sort((a,b)=>b[1]-a[1]).map(([id,c])=>({id:isNaN(+id)?id:+id,via:c}));
};

// Brand list is derived from the DB so adding a paddle above automatically
// makes its brand selectable everywhere (filters, create-listing, wishlist).
const PADDLE_BRANDS=[...new Set(Object.keys(PDB).map(k=>k.split(':')[0]))].sort();
// Models for a given brand — powers the model autocomplete on the post flow.
const pdbModels=(brand)=>Object.keys(PDB).filter(k=>k.split(':')[0]===brand).map(k=>k.split(':')[1]).sort();
// Total count, surfaced in the UI so the DB's coverage is visible.
const PDB_COUNT=Object.keys(PDB).length;
// Graceful fallback: an unrecognized paddle still renders a spec panel with
// honest "not in our database yet" placeholders rather than vanishing.
const pdbUnknown=()=>({core:null,face:null,shape:null,thk:null,wt:null,grLen:null,yr:null,avgS:null,avgL:null,rng:null,unknown:true});
const pdbGet=(b,m)=>PDB[`${b}:${m}`]||null;
// Case/whitespace-tolerant lookup so user-typed models still match the DB.
const pdbFind=(b,m)=>{
  if(!b||!m)return null;
  const direct=pdbGet(b,m);if(direct)return direct;
  const nb=String(b).trim().toLowerCase(),nm=String(m).trim().toLowerCase();
  const hit=Object.keys(PDB).find(k=>{const[kb,km]=k.split(':');return kb.toLowerCase()===nb&&km.toLowerCase()===nm;});
  return hit?PDB[hit]:null;
};

  if(L.status==='sold')return{type:'sold',label:'Sold — no longer available',col:'#EF4444'};

// Haversine distance in miles
function haversineMi(lat1,lng1,lat2,lng2){
  if(lat1==null||lng1==null||lat2==null||lng2==null)return null;
  const toRad=d=>d*Math.PI/180;
  const R=3958.8;
  const dLat=toRad(lat2-lat1),dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function timeAgo(ts){

  if(d<3600)return Math.max(1,Math.floor(d/60))+'m';
  if(d<86400)return Math.floor(d/3600)+'h';
  if(d<604800)return Math.floor(d/86400)+'d';
  if(d<2592000)return Math.floor(d/604800)+'w';
  return Math.floor(d/2592000)+'mo';
}

function AuthScreen({onSignedIn}){
  const [mode,setMode]=useState('signin');
  const [email,setEmail]=useState('');
  const [pw,setPw]=useState('');
  const [name,setName]=useState('');
  const [err,setErr]=useState('');
  const [busy,setBusy]=useState(false);
  const googleSignIn=async()=>{
    setErr('');setBusy(true);
    try{
      const {error}=await sb.auth.signInWithOAuth({
        provider:'google',
        options:{redirectTo:window.location.origin+window.location.pathname}
      });
      if(error)throw error;
      // Browser will redirect to Google; onAuthStateChange handles the return.
    }catch(ex){
      setErr(ex.message||'Google sign-in failed');
      setBusy(false);
    }
  };
  const submit=async()=>{
    setErr('');setBusy(true);
    // Quick ping to confirm Supabase is reachable before full auth call
    try{await fetch(`${SUPABASE_URL}/auth/v1/settings`,{headers:{'apikey':SUPABASE_KEY}});}
    catch(netErr){
      setErr('Cannot reach Supabase. If you\'re viewing this inside the Claude artifact viewer, download the file and open it in a new browser tab instead.');
      setBusy(false);return;
    }
    try{
      if(mode==='signup'){
        const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{name:name||email.split('@')[0]}}});
        if(error)throw error;
        // Supabase returns a user but no session when email confirmation is ON
        if(data?.user&&!data?.session){
          setErr('');
          setBusy(false);
          setMode('confirm');
          return;
        }
      }else{
        const {error}=await sb.auth.signInWithPassword({email,password:pw});
        if(error)throw error;
      }
      onSignedIn&&onSignedIn();
    }catch(ex){
      const msg=ex.message||'Failed';
      if(msg.toLowerCase().includes('fetch')){
        setErr('Network error — try downloading the file and opening it directly in your browser.');
      }else if(msg.toLowerCase().includes('confirm')||msg.toLowerCase().includes('not confirmed')){
        setErr('Check your email for a confirmation link, then sign in.');
      }else{
        setErr(msg);
      }
    }
    setBusy(false);
  };
  // Password reset. There was no way out of a forgotten password before this —
  // the only paths off the sign-in screen were a correct password or Google.
  // The confirmation copy is deliberately the same whether or not the address
  // has an account, so this can't be used to enumerate who's registered.
  const sendReset=async()=>{
    setErr('');
    const addr=(email||'').trim();
    if(!addr||!addr.includes('@')){setErr('Enter the email address on your account first.');return;}
    setBusy(true);
    try{
      await sb.auth.resetPasswordForEmail(addr,{redirectTo:window.location.origin+window.location.pathname});
      setMode('resetSent');
    }catch(ex){
      setErr('Could not send the reset email. Check your connection and try again.');
    }
    setBusy(false);
  };
  const IS={width:'100%',padding:'12px 14px',background:C.cd,border:`1px solid ${C.bd}`,borderRadius:11,color:C.tx,fontSize:13,outline:'none',marginBottom:10};
  if(mode==='resetSent')return e('div',{style:{flex:1,display:'flex',flexDirection:'column',justifyContent:'center',padding:'0 22px',background:C.bg,textAlign:'center'}},[
    e('div',{key:'i',style:{marginBottom:16,display:'flex',justifyContent:'center'}},[e(Ic,{n:'mail',s:38,c:C.lm,sw:1.5})]),
    e('div',{key:'t',style:{fontSize:18,fontWeight:800,color:C.tx,marginBottom:8}},'Check your email'),
    e('div',{key:'b',style:{fontSize:12,color:C.mt,lineHeight:1.6,marginBottom:24}},`If an account exists for ${email}, we\u2019ve sent a link to reset your password. It expires in an hour. Check your spam folder if it hasn\u2019t landed in a few minutes.`),
    e('button',{key:'go',onClick:()=>{setMode('signin');setPw('');},style:{padding:'12px 0',borderRadius:11,background:C.lm,border:'none',cursor:'pointer',fontSize:13,fontWeight:800,color:'#fff',marginBottom:10}},'Back to Sign In'),
    e('button',{key:'rs',onClick:sendReset,disabled:busy,style:{background:'none',border:'none',color:C.mt,fontSize:11,cursor:busy?'default':'pointer'}},busy?'Sending\u2026':'Resend the link'),

// --- Edit listing modal ---
// Lets sellers update price, condition, description on existing listings.
function EditListingModal({L,onClose,onSave,showToast,showError}){
  const [price,setPrice]=useState(String(L.price||''));
  const [cond,setCond]=useState(L.cond>=10?'Brand New':L.cond>=9?'Like New':L.cond>=7?'Good':L.cond>=5?'Fair':'Heavy Use');
  const [desc,setDesc]=useState(L.desc||'');
  const [busy,setBusy]=useState(false);
  const CONDS=['Brand New','Like New','Good','Fair','Heavy Use'];
  const IS={width:'100%',padding:'9px 11px',background:C.cd,border:`1px solid ${C.bd}`,borderRadius:10,color:C.tx,fontSize:12,outline:'none'};
  const valid=price&&desc;
  const submit=async()=>{
    if(!valid||busy)return;
    const safePrice=safeMoney(price);
    if(safePrice==null){showError&&showError('Price must be a valid amount under $100,000');return;}
    setBusy(true);
    try{
      await onSave({price:safePrice,cond,desc:sanitizeText(desc,2000)});
      showToast&&showToast('Listing updated');
      onClose();
    }catch(err){showError&&showError('Could not update listing. Try again.');}

// --- Price history sparkline chart ---
function PriceHistoryChart({L}){
  // null while loading, [] once we know there's nothing to draw. Both render
  // as nothing — a half-drawn chart is worse than no chart.
  const [pts,setPts]=useState(null);
  const lid=L&&L.id;
  useEffect(()=>{
    let alive=true;
    fetchPriceHistory(lid).then(rows=>{if(alive)setPts(rows);});
    return()=>{alive=false;};
  },[lid]);
  if(!pts||pts.length<2)return null;
  const W=300,H=70,pad=8;
  const prices=pts.map(p=>p.price);
  const lo=Math.min(...prices),hi=Math.max(...prices),span=hi-lo||1;
  const x=i=>pad+(i/(pts.length-1))*(W-pad*2);
  const y=p=>H-pad-((p-lo)/span)*(H-pad*2-10);
  const path=pts.map((p,i)=>`${i===0?'M':'L'}${x(i).toFixed(1)},${y(p.price).toFixed(1)}`).join(' ');
  const area=`${path} L${x(pts.length-1)},${H-pad} L${x(0)},${H-pad} Z`;
  const first=pts[0].price,last=pts[pts.length-1].price;
  const down=last<first;const delta=Math.abs(last-first);
  return e('div',{style:{background:C.sf,borderRadius:11,padding:11,border:`1px solid ${C.bd}`}},[
    e('div',{key:'h',style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:7}},[
      e('span',{style:{fontSize:10,color:C.mt,fontWeight:700,letterSpacing:.3}},'PRICE HISTORY'),
      delta>0&&e('span',{style:{fontSize:10,fontWeight:800,color:down?C.ok:C.am}},`${down?'▼':'▲'} $${delta} over ${pts[0].label}`),
    ]),
    e('svg',{key:'s',viewBox:`0 0 ${W} ${H}`,style:{width:'100%',height:H,display:'block'}},[
      e('defs',{key:'d'},[e('linearGradient',{id:'phg',x1:0,y1:0,x2:0,y2:1},[e('stop',{offset:'0%',stopColor:(down?C.ok:C.am),stopOpacity:0.28}),e('stop',{offset:'100%',stopColor:(down?C.ok:C.am),stopOpacity:0})])]),
      e('path',{key:'a',d:area,fill:'url(#phg)'}),
      e('path',{key:'l',d:path,fill:'none',stroke:down?C.ok:C.am,strokeWidth:2,strokeLinejoin:'round',strokeLinecap:'round'}),
      ...pts.map((p,i)=>e('circle',{key:'c'+i,cx:x(i),cy:y(p.price),r:i===pts.length-1?3.5:2.5,fill:i===pts.length-1?(down?C.ok:C.am):C.sf,stroke:down?C.ok:C.am,strokeWidth:1.5})),
      // Real history can be 2 points or 24, so only label the ends and the
      // middle — labelling every point turns the axis into a smear.
      ...pts.map((p,i)=>{
        const isEnd=i===0||i===pts.length-1;
        const isMid=pts.length>4&&i===Math.floor((pts.length-1)/2);
        if(!isEnd&&!isMid)return null;
        return e('text',{key:'t'+i,x:x(i),y:H-1,fontSize:7,fill:C.mt,textAnchor:i===0?'start':i===pts.length-1?'end':'middle'},i===pts.length-1?'now':p.label);
      }).filter(Boolean),
    ]),
  ]);
}

function App(){
  const [authState,setAuthState]=useState('loading');
  const [me,setMe]=useState(null);
  const [tab,setTab]=useState('feed');
  const [view,setView]=useState(null);
  const [saved,setSaved]=useState([1,2,4,6,8]);
  const [savedMeta,setSavedMeta]=useState({}); // listing_id -> {prev_price, created_at}
  const [crt,setCrt]=useState(false);
  const [crtPrefill,setCrtPrefill]=useState(null); // for relist
  const [pst,setPst]=useState(false);
  const [notifOpen,setNotifOpen]=useState(false);
  const [savedOpen,setSavedOpen]=useState(false);
  const [settingsOpen,setSettingsOpen]=useState(false);
  const [offerOpen,setOfferOpen]=useState(null);
  const [locMode,setLocMode]=useState(()=>kv.get('locMode','local'));
  // Paddles are the core of the marketplace, so that's the default landing category.
  // Stale values from the retired Shoes/Bags/Apparel/Accessories tabs map to Gear.
  const [marketCat,setMarketCat]=useState(()=>{const v=kv.get('marketCat','Paddles');return ['All','Paddles','Gear'].includes(v)?v:'Gear';});
  // Persisted Market filters — hydrated from kv on first render, then re-written by an effect below.
  const [marketFilters,setMarketFilters]=useState(()=>{const stored=kv.get('marketFilters',null);return stored?normFilters(stored):{...initFilters};});
  const [msgs,setMsgs]=useState([...MSGS_INIT]);
  const [activeMsgIdx,setActiveMsgIdx]=useState(null);
  const demoUserList=(ids)=>ids.map(id=>US.find(u=>u.id===id)).filter(Boolean);
  const [following,setFollowing]=useState([1,4,6]); // user ids I follow (demo seed)
  const [followers,setFollowers]=useState(demoUserList([...(FOLLOW_GRAPH[0]||[])])); // who follows me
  const [followingUsers,setFollowingUsers]=useState(demoUserList([1,4,6])); // profiles I follow
  // Global UI feedback
  const [toast,setToast]=useState(null);
  const [errorMsg,setErrorMsg]=useState(null);
  const [buyConfirm,setBuyConfirm]=useState(null);
  const [reviewFor,setReviewFor]=useState(null);
  const [safetyOpen,setSafetyOpen]=useState(false);
  const [condGuideOpen,setCondGuideOpen]=useState(false);
  const [sellerView,setSellerView]=useState(null);   // public seller profile overlay
  const [verifyOpen,setVerifyOpen]=useState(false);  // identity/phone verification
  const [verified,setVerified]=useState(()=>kv.get('verified',false));
  const [pushOn,setPushOn]=useState(()=>pushPermGet()==='granted');
  const [onboardStep,setOnboardStep]=useState(0);
  // Trust & safety / legal surfaces
  const [reportTarget,setReportTarget]=useState(null);   // {type,id,ownerId,label}
  const [legalKind,setLegalKind]=useState(null);         // 'terms' | 'privacy'
  const [prohibitedOpen,setProhibitedOpen]=useState(false);
  const [blockedOpen,setBlockedOpen]=useState(false);
  const [deleteAcctOpen,setDeleteAcctOpen]=useState(false);
  const [isOnline,setIsOnline]=useState(()=>typeof navigator==='undefined'||navigator.onLine!==false);
  const [blockVer,setBlockVer]=useState(0);              // bumps when the block list changes
  const [onboardDismissed,setOnboardDismissed]=useState(false);
  // Theme: light by default, hydrated from kv. Triggers a render via themeTick so closures pick up the new C values.
  const [themeMode,setThemeMode]=useState(()=>kv.get('themeMode','light'));
  const [,setThemeTick]=useState(0);
  useEffect(()=>{applyTheme(themeMode);kv.set('themeMode',themeMode);setThemeTick(t=>t+1);},[themeMode]);
  // Register the service worker once so push/offline can be layered on in production
  useEffect(()=>{registerSW();},[]);
  // Global crash capture + batched analytics flushing. Without this we'd have no
  // signal at all on what breaks for real users after launch.
  useEffect(()=>{initErrorReporting();track('app_open',{});},[]);
  // When the block list changes, prune already-loaded listings and threads in
  // place so the effect is immediate rather than waiting for the next fetch.
  useEffect(()=>{
    if(blockVer===0)return;
    const before=LS.length;
    for(let i=LS.length-1;i>=0;i--){if(isBlocked(LS[i].sid))LS.splice(i,1);}
    setMsgs(ms=>ms.filter(t=>!isBlocked(t.wu&&t.wu.id)));
    if(LS.length!==before)setDataVer(v=>v+1);
  },[blockVer]);
  // Connectivity banner — actions that hit the network fail confusingly offline.
  useEffect(()=>{
    const on=()=>{setIsOnline(true);outboxFlush();};
    const off=()=>setIsOnline(false);
    window.addEventListener('online',on);window.addEventListener('offline',off);
    return()=>{window.removeEventListener('online',on);window.removeEventListener('offline',off);};
  },[]);
  // Recently viewed listing ids (hydrated from kv)
  const [recentlyViewed,setRecentlyViewed]=useState(()=>recentGet());
  const showToast=useCallback((msg)=>setToast(msg),[]);
  const showError=useCallback((msg)=>setErrorMsg(msg),[]);

  // Persist filters/location/category on change
  useEffect(()=>{kv.set('locMode',locMode);},[locMode]);
  useEffect(()=>{kv.set('marketCat',marketCat);},[marketCat]);
  useEffect(()=>{kv.set('marketFilters',marketFilters);},[marketFilters]);

  // Keep module-level follow state in sync for LCard / helpers
  useEffect(()=>{FOLLOWING=new Set(following);},[following]);
  useEffect(()=>{FOLLOW_GRAPH[0]=new Set((followers||[]).map(u=>u.id));},[followers]);
  const [settings,setSettings]=useState({name:ME.name,location:ME.loc,skill:ME.skill,cashapp:ME.cashapp,venmo:ME.venmo,notifWishlist:true,notifPriceDrops:true,notifMessages:true,preciseLoc:false,blockedCt:0,darkMode:themeMode==='dark'});
  // Sync darkMode toggle <-> themeMode
  useEffect(()=>{const target=settings.darkMode?'dark':'light';if(target!==themeMode)setThemeMode(target);},[settings.darkMode]);

  // --- AUTH + PROFILE LOAD ---
  const loadProfile=useCallback(async(userId)=>{
    // Session-scoped hydration: pull the server-side block list so blocks follow
    // the account across devices, retry any safety writes queued while offline,
    // and attach the user id to analytics events.
    analyticsIdentify(userId);
    blocksLoad(userId).then(()=>setBlockVer(v=>v+1));
    outboxFlush();
    try{
      const {data:prof}=await sb.from('profiles').select('*').eq('id',userId).maybeSingle();
      const {data:us}=await sb.from('user_settings').select('*').eq('user_id',userId).maybeSingle();
      if(prof){
        const meObj={
          id:prof.id,name:prof.name||'Player',ini:prof.initials||'??',
          vfd:!!prof.verified,loc:prof.location||'—',skill:prof.skill||'—',
          since:prof.created_at?new Date(prof.created_at).getFullYear().toString():'—',
          resp:prof.response_time||'—',sales:prof.sales_count||0,bio:prof.bio||'',
          ac:prof.avatar_color||'#4DA8FF',bdg:prof.badges||[],
          cashapp:prof.cashapp||'',venmo:prof.venmo||'',
          rating:prof.rating||0,rev:prof.review_count||0,trust:prof.trust_score||50,
          lat:prof.lat,lng:prof.lng,
        };
        setMe(meObj);
        if(us){
          setSettings({
            name:meObj.name,location:meObj.loc,skill:meObj.skill,
            cashapp:meObj.cashapp,venmo:meObj.venmo,
            notifWishlist:us.notif_wishlist,notifPriceDrops:us.notif_price_drops,
            notifMessages:us.notif_messages,
            preciseLoc:us.precise_location,blockedCt:0,searchRadius:us.search_radius_mi||25,
            darkMode:themeMode==='dark',
          });
        }
      } else {
        // Auth session exists but no profile row yet — use a safe default so the app doesn't hang
        setMe({
          id:userId,name:'New Player',ini:'NP',vfd:false,
          loc:'Set your location',skill:'—',since:new Date().getFullYear().toString(),
          resp:'—',sales:0,bio:'',ac:'#4DA8FF',bdg:[],
          cashapp:'',venmo:'',rating:0,rev:0,trust:50,lat:null,lng:null,
        });
      }
    }catch(err){
      console.error('loadProfile error:',err);
      // Still unblock the UI — don't leave user on loading screen
      setMe({
        id:userId,name:'Player',ini:'P',vfd:false,
        loc:'—',skill:'—',since:'—',
        resp:'—',sales:0,bio:'',ac:'#4DA8FF',bdg:[],
        cashapp:'',venmo:'',rating:0,rev:0,trust:50,lat:null,lng:null,
      });
    }
  },[]);

  useEffect(()=>{
    let mounted=true;
    // Safety timeout — if auth check takes >4s, bail to login screen
    const failsafe=setTimeout(()=>{
      if(mounted)setAuthState(s=>s==='loading'?'out':s);
    },4000);
    sb.auth.getSession().then(async({data:{session}})=>{
      if(!mounted)return;
      try{
        if(session?.user){await loadProfile(session.user.id);if(mounted)setAuthState('in');}
        else if(mounted)setAuthState('out');
      }catch(e){
        console.error('Auth init error:',e);
        if(mounted)setAuthState('out');
      }
    }).catch(()=>{ if(mounted)setAuthState('out'); });
    const {data:{subscription}}=sb.auth.onAuthStateChange(async(_evt,session)=>{
      if(!mounted)return;
      try{
        if(session?.user){await loadProfile(session.user.id);if(mounted)setAuthState('in');}
        else{if(mounted){setMe(null);setAuthState('out');}}
      }catch(e){
        console.error('Auth state change error:',e);
        if(mounted)setAuthState('out');
      }
    });
    return()=>{mounted=false;clearTimeout(failsafe);subscription.unsubscribe();};
  },[loadProfile]);

  const signOut=async()=>{await sb.auth.signOut();};

  // --- LISTINGS FETCH ---
  const [dataVer,setDataVer]=useState(0);
  const [dataLoading,setDataLoading]=useState(false);
  // True when the listings table came back empty and we're showing seeded
  // sample data. Drives the "Sample listings" banner so nobody tries to buy
  // from a seller who isn't there.
  const [demoData,setDemoData]=useState(false);
  // Cursor-based pagination state. `listingsCursor` holds the oldest created_at we've fetched.
  // `hasMoreListings` lets the UI hide the "Load more" affordance when we've reached the end.
  const LISTINGS_PAGE_SIZE=50;
  const [listingsCursor,setListingsCursor]=useState(null);
  const [hasMoreListings,setHasMoreListings]=useState(true);
  const fetchListings=useCallback(async()=>{
    if(!me)return;
    setDataLoading(true);
    const meLL=(me.lat!=null&&me.lng!=null)?{lat:Number(me.lat),lng:Number(me.lng)}:null;
    // First page: 50 most recent listings (was 200 in one shot)
    const {data:rows,error}=await sb
      .from('listings')
      .select('*, seller:profiles!seller_id(*), paddle_spec:paddle_specs(*), photos:listing_photos(url,position)')
      .neq('status','deleted')
      .order('created_at',{ascending:false})
      .limit(LISTINGS_PAGE_SIZE);
    if(error){console.error('listings fetch',error);setDataLoading(false);showError('Could not load listings. Pull down to retry.');return;}
    if(!rows||rows.length===0){
      // No real listings yet — keep the seeded sample data visible so the app
      // isn't an empty shell, but flag it so the UI can say so. Showing seeded
      // sellers as if they were real neighbours means someone messages a person
      // who doesn't exist and waits for a reply that can't come.
      setDemoData(true);
      setDataLoading(false);setDataVer(v=>v+1);setHasMoreListings(false);return;
    }
    setDemoData(false);
    // Build users map from sellers
    const usersMap=new Map();
    (rows||[]).forEach(r=>{if(r.seller&&!usersMap.has(r.seller.id))usersMap.set(r.seller.id,profileToUser(r.seller));});
    // Attach distance to each user
    if(meLL){
      for(const u of usersMap.values()){
        if(u.lat!=null&&u.lng!=null){
          const d=haversineMi(meLL.lat,meLL.lng,u.lat,u.lng);
          if(d!=null)u.dist=Math.round(d*10)/10;
        }
      }
    }
    US.length=0;usersMap.forEach(u=>US.push(u));
    // Map listings
    const active=[],sold=[];
    (rows||[]).forEach(r=>{
      const L=mapListingRow(r,meLL);
      if(r.status==='sold')sold.push(L);else active.push(L);
    });
    // Blocking has to actually hide content, not just stop DMs.
    LS.length=0;active.filter(l=>!isBlocked(l.sid)).forEach(l=>LS.push(l));
    SOLD.length=0;sold.slice(0,8).forEach(s=>SOLD.push({
      id:s.id,brand:s.brand,model:s.model,
      price:s.sold_price?Number(s.sold_price):s.price,
      orig:s.orig||s.price,dist:s.dist,ago:s.sold_at?timeAgo(s.sold_at):s.ago,loc:s.loc,
    }));
    // Remember the oldest row's timestamp so loadMoreListings can paginate from there
    const last=rows[rows.length-1];
    setListingsCursor(last?.created_at||null);
    setHasMoreListings(rows.length>=LISTINGS_PAGE_SIZE);
    setDataLoading(false);
    setDataVer(v=>v+1);
  },[me]);

  // Append next page; called from a "Load more" affordance or infinite scroll trigger.
  const loadMoreListings=useCallback(async()=>{
    if(!me||!listingsCursor||!hasMoreListings)return;
    const meLL=(me.lat!=null&&me.lng!=null)?{lat:Number(me.lat),lng:Number(me.lng)}:null;
    const {data:rows,error}=await sb
      .from('listings')
      .select('*, seller:profiles!seller_id(*), paddle_spec:paddle_specs(*), photos:listing_photos(url,position)')
      .neq('status','deleted')
      .lt('created_at',listingsCursor)
      .order('created_at',{ascending:false})
      .limit(LISTINGS_PAGE_SIZE);
    if(error){console.error('listings paginate',error);showError('Could not load more listings. Check your connection.');return;}
    if(!rows||rows.length===0){setHasMoreListings(false);return;}
    rows.forEach(r=>{
      if(r.seller&&!US.find(u=>u.id===r.seller.id)){
        const u=profileToUser(r.seller);
        if(meLL&&u.lat!=null&&u.lng!=null){const d=haversineMi(meLL.lat,meLL.lng,u.lat,u.lng);if(d!=null)u.dist=Math.round(d*10)/10;}
        US.push(u);
      }
      if(r.status!=='sold'){const ml=mapListingRow(r,meLL);if(!isBlocked(ml.sid))LS.push(ml);}
    });
    const last=rows[rows.length-1];
    setListingsCursor(last?.created_at||null);
    setHasMoreListings(rows.length>=LISTINGS_PAGE_SIZE);
    setDataVer(v=>v+1);
  },[me,listingsCursor,hasMoreListings]);

  useEffect(()=>{if(me)fetchListings();},[me,fetchListings]);

  // --- CONVERSATIONS FETCH ---
  const fetchConversations=useCallback(async()=>{
    if(!me?.id)return;
    const {data:rows,error}=await sb
      .from('conversations')
      .select(`*,
        buyer_profile:profiles!buyer_id(*),
        seller_profile:profiles!seller_id(*),
        listing:listings(id,brand,model,price,type),
        messages(id,conversation_id,sender_id,kind,body,payload,read_at,created_at)
      `)
      .or(`buyer_id.eq.${me.id},seller_id.eq.${me.id}`)
      .order('last_message_at',{ascending:false})
      .limit(50);
    if(error){console.error('convs fetch',error);showError('Could not refresh your messages. Pull down to retry.');return;}
    if(!rows||rows.length===0)return; // keep demo data
    // Sort messages within each conversation
    rows.forEach(r=>{if(r.messages)r.messages.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));});
    setMsgs(rows.map(r=>mapConversation(r,me.id)).filter(t=>!isBlocked(t.wu&&t.wu.id)));
  },[me]);

  useEffect(()=>{if(me)fetchConversations();},[me,fetchConversations]);

  // --- NOTIFICATIONS ---
  const [notifs,setNotifs]=useState([...NOTIFS]);
  // gearmatch: a wishlist somewhere matches gear you've flagged for sale
  // (migration 0007). wantreply: someone answered your want post (0008).
  const TYPE_ICONS={wishlist:'flame',message:'message',pricedrop:'dollar',offer:'dollar',follow:'users',newlisting:'tag',gearmatch:'swap',wantreply:'message'};
  const mapNotif=(n)=>({
    id:n.id,type:n.type,ic:n.icon||TYPE_ICONS[n.type]||'bell',
    title:n.title,msg:n.message,time:timeAgo(n.created_at),
    unread:!n.read,listingId:n.listing_id,detail:n.payload?.detail,
    raw:n,
  });
  const fetchNotifications=useCallback(async()=>{
    if(!me?.id)return;
    const {data}=await sb.from('notifications').select('*').eq('user_id',me.id).order('created_at',{ascending:false}).limit(50);
    if(data&&data.length>0)setNotifs(data.map(mapNotif));
  },[me]);
  useEffect(()=>{if(me)fetchNotifications();},[me,fetchNotifications]);
  const markNotifRead=async(id)=>{
    setNotifs(ns=>ns.map(n=>n.id===id?{...n,unread:false}:n));
    if(typeof id==='string'&&me?.id)await sb.from('notifications').update({read:true}).eq('id',id).eq('user_id',me.id);
  };

  // --- FOLLOWS ---
  const fetchFollows=useCallback(async()=>{
    if(!me?.id)return;
    // Who I follow
    const {data:fRows}=await sb.from('follows')
      .select('following_id, followed:profiles!following_id(*)')
      .eq('follower_id',me.id);
    // Who follows me
    const {data:rRows}=await sb.from('follows')
      .select('follower_id, follower:profiles!follower_id(*)')
      .eq('following_id',me.id);
    if(fRows&&fRows.length>0){
      setFollowing(fRows.map(r=>r.following_id));
      setFollowingUsers(fRows.filter(r=>r.followed).map(r=>profileToUser(r.followed)));
    }
    if(rRows&&rRows.length>0){
      setFollowers(rRows.filter(r=>r.follower).map(r=>profileToUser(r.follower)));
    }
  },[me]);
  useEffect(()=>{if(me)fetchFollows();},[me,fetchFollows]);

  const toggleFollow=async(userId)=>{
    if(!userId||userId===me?.id)return;
    const isF=following.includes(userId);
    haptic();
    // Optimistic update
    setFollowing(f=>isF?f.filter(x=>x!==userId):[...f,userId]);
    // Toast feedback
    const target=US.find(u=>u.id===userId)||followingUsers.find(u=>u.id===userId);
    const name=target?.name?.split(' ')[0]||'user';
    showToast(isF?`Unfollowed ${name}`:`Following ${name} — you'll see their new listings first`);
    // Keep the Following list in sync for demo (integer) users
    if(typeof userId==='number'){
      if(isF)setFollowingUsers(us=>us.filter(u=>u.id!==userId));
      else{const du=US.find(u=>u.id===userId);if(du)setFollowingUsers(us=>us.some(u=>u.id===userId)?us:[du,...us]);}
      return;
    }
    // Real DB write only for UUID users + signed-in real profile
    if(typeof userId==='string'&&userId.length>=32&&me?.id){
      if(isF){
        const {error}=await sb.from('follows').delete().eq('follower_id',me.id).eq('following_id',userId);
        if(error){
          // Roll the optimistic flip back rather than leaving the button
          // showing a state the server never accepted.
          setFollowing(f=>f.includes(userId)?f:[...f,userId]);
          showError('Could not unfollow. Try again.');
          return;
        }
        setFollowingUsers(us=>us.filter(u=>u.id!==userId));
      }else{
        const {error}=await sb.from('follows').insert({follower_id:me.id,following_id:userId});
        if(error){
          setFollowing(f=>f.filter(x=>x!==userId));
          showError('Could not follow. Try again.');
          return;
        }
        // The "New follower" notification is written by the follows_notify_trg
        // trigger (migration 0006). It used to be inserted from here, which
        // required a policy letting any client write a notification into any
        // other user's tray — attacker-controlled title and body, delivered as
        // a push. That policy is gone; this is now the server's job.
        const {data:prof}=await sb.from('profiles').select('*').eq('id',userId).maybeSingle();
        if(prof)setFollowingUsers(us=>[profileToUser(prof),...us]);
      }
    }
  };

  // --- REALTIME SUBSCRIPTIONS ---
  // The previous version fetched all 50 conversations on every message INSERT, which
  // is wasteful and causes UI flicker. This version:
  //   1. Appends new messages to the active conversation in place
  //   2. Bumps the unread count on inactive conversations without refetching
  //   3. Only does a full refetch if we receive a message for a thread we don't know yet
  //   4. Listens to listing UPDATEs and detects price drops on saved listings,
  //      then injects a synthetic "pricedrop" notification client-side. (Production
  //      should also have a DB trigger — see SQL in comment block below.)
  useEffect(()=>{
    if(!me?.id)return;
    const savedSet=new Set(saved.filter(x=>typeof x==='string'));
    const ch=sb.channel('user-'+me.id)
      // New messages: append to the right thread in place
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},(payload)=>{
        const m=payload.new;if(!m)return;
        if(m.sender_id===me.id)return; // ignore my own optimistic echo
        setMsgs(ms=>{
          const i=ms.findIndex(t=>t.id===m.conversation_id);
          if(i<0){fetchConversations();return ms;} // unknown thread — full refetch
          const mapped=mapMessageRow(m,me.id);
          const lastTxt=m.kind==='text'?(m.body||''):m.kind==='offer'?`Offered $${m.payload?.amount||''}`:m.kind==='buynow'?`Buy Now $${m.payload?.amount||''}`:m.kind==='accept'?`Accepted $${m.payload?.amount||''}`:m.kind==='counter'?`Countered $${m.payload?.amount||''}`:m.kind==='payment'?`Sent $${m.payload?.amount||''} via ${m.payload?.method||''}`:'[message]';
          pushNotify(ms[i]?.n||'New message',lastTxt,{tag:'msg-'+m.conversation_id});
          return ms.map((t,idx)=>idx!==i?t:{
            ...t,cv:[...t.cv,mapped],last:lastTxt,time:'Now',
            unread:idx===activeMsgIdx?0:(t.unread||0)+1,
          });
        });
      })
      // Offer status changes: full refetch (less frequent, payload includes accepted flow)
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'offers'},()=>{
        fetchConversations();
      })
      // Conversation deal_status changes (e.g. other party accepted)
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'conversations'},()=>{
        fetchConversations();
      })
      // Listing updates: detect price drops on saved listings and notify locally
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'listings'},(payload)=>{
        const n=payload.new,o=payload.old;if(!n||!o)return;
        if(!savedSet.has(n.id))return;
        const oldP=Number(o.price),newP=Number(n.price);
        if(!isNaN(oldP)&&!isNaN(newP)&&newP<oldP){
          // Refresh listings so the new price shows everywhere
          fetchListings();
          // Local notification — production should also fire a server-side trigger:
          //
          //   CREATE OR REPLACE FUNCTION notify_price_drop() RETURNS TRIGGER AS $$
          //   BEGIN
          //     IF NEW.price < OLD.price THEN
          //       INSERT INTO notifications (user_id, type, title, message, listing_id, payload)
          //       SELECT s.user_id, 'pricedrop',
          //              'Price dropped on saved listing',
          //              NEW.brand || ' ' || NEW.model || ' — now $' || NEW.price || ' (was $' || OLD.price || ')',
          //              NEW.id, jsonb_build_object('old_price', OLD.price, 'new_price', NEW.price)
          //         FROM saved_listings s WHERE s.listing_id = NEW.id;
          //     END IF;
          //     RETURN NEW;
          //   END; $$ LANGUAGE plpgsql;
          //
          //   CREATE TRIGGER on_listing_price_drop AFTER UPDATE OF price ON listings
          //     FOR EACH ROW EXECUTE FUNCTION notify_price_drop();
          //
          setNotifs(ns=>[{
            id:'pd-'+n.id+'-'+Date.now(),type:'pricedrop',ic:'dollar',
            title:'Price drop on saved listing',
            msg:`${n.brand} ${n.model} — now $${newP} (was $${oldP})`,
            time:'Now',unread:true,listingId:n.id,
            detail:`Save $${oldP-newP}`,
          },...ns]);
          showToast(`Price drop: ${n.brand} ${n.model} — now $${newP}`);
          pushNotify('Price drop on a saved listing',`${n.brand} ${n.model} — now $${newP} (was $${oldP})`,{tag:'pd-'+n.id});
        }
      })
      // New notifications for me
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:`user_id=eq.${me.id}`},(payload)=>{
        const n=mapNotif(payload.new);
        setNotifs(ns=>[n,...ns]);
        pushNotify(n.title||'DINK Exchange',n.msg||'',{tag:'nt-'+(payload.new?.id||Date.now())});
        if(payload.new?.type==='follow')fetchFollows();
      })
      .subscribe();
    return()=>{sb.removeChannel(ch);};
  },[me,fetchConversations,activeMsgIdx,saved]);

  const togSv=async(id)=>{
    // For demo (integer ids), just toggle locally
    if(typeof id==='number'){setSaved(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);return;}
    if(!me?.id)return;
    const wasSaved=saved.includes(id);
    // Optimistic update — flip immediately, roll back if the DB write fails
    if(wasSaved){
      setSaved(s=>s.filter(x=>x!==id));
      const {error}=await sb.from('saved_listings').delete().eq('user_id',me.id).eq('listing_id',id);
      if(error){
        // Rollback
        setSaved(s=>s.includes(id)?s:[...s,id]);
        showError('Could not unsave. Try again.');
      }
    }else{
      setSaved(s=>[...s,id]);
      const {data,error}=await sb.from('saved_listings').insert({user_id:me.id,listing_id:id}).select().single();
      if(error){
        // Rollback
        setSaved(s=>s.filter(x=>x!==id));
        showError('Could not save. Try again.');
      }else if(data){
        setSavedMeta(m=>({...m,[id]:{prev_price:data.prev_price,created_at:data.created_at}}));
      }
    }
  };

  // --- LISTING CRUD HANDLERS ---
  // Edit: update price/condition/desc on a listing the current user owns.
  const condMap={'Brand New':10,'Like New':9,'Good':7,'Fair':5,'Heavy Use':3};
  const handleEditListing=async(L,patch)=>{
    if(!me?.id||typeof L.id!=='string')return; // demo data is read-only
    const row={};
    if(patch.price!=null)row.price=safeMoney(patch.price);
    if(patch.cond)row.condition=condMap[patch.cond]||7;
    if(patch.desc!=null)row.description=sanitizeText(patch.desc,2000);
    const {error}=await sb.from('listings').update(row).eq('id',L.id).eq('seller_id',me.id);
    if(error){showError('Could not save changes. Try again.');throw error;}
    await fetchListings();
  };
  // Delete: soft-delete (set status='deleted'). Hidden from feeds via .neq('status','deleted') filter.
  const handleDeleteListing=async(L)=>{
    if(!me?.id||typeof L.id!=='string')return;
    const {error}=await sb.from('listings').update({status:'deleted'}).eq('id',L.id).eq('seller_id',me.id);
    if(error){showError('Could not delete listing. Try again.');return;}
    await fetchListings();
  };
  // Mark sold: status='sold' + sold_at timestamp. Listing still shows in seller's "SOLD" tab.
  const handleMarkSold=async(L)=>{
    if(!me?.id||typeof L.id!=='string')return;
    const {error}=await sb.from('listings').update({status:'sold',sold_at:new Date().toISOString()}).eq('id',L.id).eq('seller_id',me.id);
    if(error){showError('Could not mark as sold. Try again.');return;}
    await fetchListings();
  };
  // Relist: open the create overlay with key fields pre-filled from the sold listing.
  const handleRelist=(L)=>{
    openPanel('create',{brand:L.brand,model:L.model,cat:L.cat||'paddle',cond:'Like New',desc:L.desc||''});
    showToast('Review and post — fields pre-filled from previous listing');
  };
  // Update bio: writes to profiles, updates local me.
  const handleUpdateBio=async(bio)=>{
    if(!me?.id)return;
    const safe=sanitizeText(bio,500);
    setMe(m=>m?{...m,bio:safe}:m);
    const {error}=await sb.from('profiles').update({bio:safe}).eq('id',me.id);
    if(error){showError('Could not save bio. Try again.');throw error;}
  };

  // Fetch saved listings (DB) when me is loaded
  useEffect(()=>{
    if(!me?.id)return;
    let mounted=true;
    sb.from('saved_listings').select('listing_id, prev_price, created_at').eq('user_id',me.id).then(({data})=>{
      if(!mounted||!data)return;
      const ids=data.map(r=>r.listing_id);
      const meta={};data.forEach(r=>{meta[r.listing_id]={prev_price:r.prev_price,created_at:r.created_at};});
      // Merge with demo integer ids only if there are no DB rows yet
      if(ids.length>0){setSaved(ids);setSavedMeta(meta);}
    });
    return()=>{mounted=false;};
  },[me]);
  const togLoc=()=>setLocMode(m=>m==='local'?'anywhere':'local');
  const handlePost=async(formData,photoFiles)=>{
    if(!me?.id)return;
    // --- SECURITY: sanitize every user-typed field before it touches the DB ---
    const isPaddle=formData.cat==='paddle';
    // Gear carries no brand — sellers give one free-text item title instead,
    // which lands in `model`. Store null rather than '' so the column stays
    // honestly empty and the display helpers fall back to the gear type.
    const safeBrand=isPaddle?sanitizeText(formData.brand,40):null;
    const safeModel=sanitizeText(formData.model,80);
    const safeDesc=sanitizeText(formData.desc,2000);
    const safePrice=safeMoney(formData.price);
    if((isPaddle&&!safeBrand)||!safeModel||safePrice==null){
      console.warn('handlePost: invalid required fields');
      throw new Error('Missing required fields');
    }
    // --- ABUSE CONTROLS ---
    // Rate limit first (cheap), then content policy. Both also need to exist
    // server-side as a Postgres trigger; this layer is for fast feedback.
    const rl=rateCheck('listing_create');
    if(!rl.ok){showError(rl.message);throw new Error('rate_limited');}
    const cc=contentCheck([safeBrand,safeModel,safeDesc].filter(Boolean).join(' '));
    if(cc.blocked){showError(cc.reason);track('listing_blocked_by_filter',{});throw new Error('content_blocked');}
    const condMap={'Brand New':10,'Like New':9,'Good':7,'Fair':5,'Heavy Use':3};
    // Look up paddle_spec id if paddle
    let specId=null;
    if(formData.cat==='paddle'){
      const {data:spec}=await sb.from('paddle_specs').select('id').eq('brand',safeBrand).eq('model',safeModel).maybeSingle();
      if(spec)specId=spec.id;
    }
    const row={
      seller_id:me.id,
      category:formData.cat,
      brand:safeBrand,
      model:safeModel,
      price:safePrice,
      condition:condMap[formData.cond]||7,
      type:'sale',
      sub:formData.cat==='gear'?formData.sub:null,
      description:safeDesc,
      location:sanitizeText(me.loc||'',80),
      lat:me.lat,lng:me.lng,
      paddle_spec_id:specId,
      tag:'NEW',
    };
    // Per-unit measured weight. weight_class is NOT sent: a trigger
    // derives it from this number server-side, so a seller can't tag a
    // 9oz paddle "Lightweight" to catch a filter it shouldn't match.
    const wOz=parseFloat(formData.weightOz);
    if(isFinite(wOz)&&wOz>3&&wOz<17)row.measured_weight_oz=Math.round(wOz*10)/10;
    const {data:listing,error}=await sb.from('listings').insert(row).select().single();
    // Surface the failure instead of returning silently — CrtOverlay shows an
    // error banner on throw, but a bare `return` looked like a successful post.
    if(error){console.error('insert listing',error);throw new Error(error.message||'insert_failed');}
    rateRecord('listing_create');
    track('listing_created',{cat:formData.cat,photos:(photoFiles||[]).length});
    // Teach the catalogue anything this seller knew that we didn't. The
    // RPC only fills NULLs — it never overwrites an existing value, so
    // one user can't rewrite specs everyone else depends on. Failure here
    // is non-fatal: the listing is already posted and a missing spec is
    // not worth surfacing an error over.
    if(specId&&(formData.specCore||formData.specGrip||formData.specHandle||
                formData.specShape||formData.specThickness||formData.specFace)){
      try{
        const {data:enr}=await sb.rpc('enrich_paddle_spec',{
          p_spec_id:specId,
          p_core:formData.specCore||null,
          p_grip:formData.specGrip?parseFloat(formData.specGrip):null,
          p_handle:formData.specHandle?parseFloat(formData.specHandle):null,
          p_shape:formData.specShape||null,
          p_thickness:formData.specThickness||null,
          p_face:formData.specFace||null,
        });
        const r=Array.isArray(enr)?enr[0]:enr;
        if(r&&r.conflicted){
          // Contributed core material disagrees with the USAP record for
          // this paddle. Not written, not argued with — logged for review.
          track('spec_conflict',{spec_id:specId,field:'core_material'});
        }else if(r&&r.filled&&r.filled.length){
          track('spec_enriched',{spec_id:specId,fields:r.filled.length});
        }
      }catch(err){console.warn('enrich_paddle_spec',err);}

      // Anything the seller changed away from a value we supplied goes to
      // the corrections queue. enrich_paddle_spec only fills NULLs — one
      // user must not be able to rewrite specs everyone else relies on —
      // so without this the edit would be accepted in the UI and quietly
      // discarded, which is the failure mode we keep designing out.
      const overrides=formData.specOverrides||{};
      for(const [field,suggested] of Object.entries(overrides)){
        try{
          await sb.rpc('suggest_spec_correction',{p_spec_id:specId,p_field:field,p_suggested:String(suggested)});
          track('spec_correction_filed',{spec_id:specId,field});
        }catch(err){console.warn('suggest_spec_correction',err);}
      }
    }
    // Upload photos to storage and insert listing_photos rows
    if(photoFiles&&photoFiles.length>0&&listing){
      const photoRows=[];
      for(let i=0;i<photoFiles.length;i++){
        const file=photoFiles[i];
        const ext=((file.name||'').split('.').pop()||'jpg').toLowerCase();
        const path=`${me.id}/${listing.id}/${i}.${ext}`;
        const {error:upErr}=await sb.storage.from('listing-photos').upload(path,file,{cacheControl:'3600',upsert:true,contentType:file.type});
        if(upErr){console.error('photo upload',upErr);continue;}
        const {data:pub}=sb.storage.from('listing-photos').getPublicUrl(path);
        // Defense-in-depth: only persist URLs that pass the same allowlist as ingest
        const cleanUrl=safePhotoURL(pub.publicUrl);
        if(cleanUrl)photoRows.push({listing_id:listing.id,url:cleanUrl,position:i});
      }
      if(photoRows.length>0){
        const {error:photoErr}=await sb.from('listing_photos').insert(photoRows);
        if(photoErr)console.error('photo rows insert',photoErr);
      }

    // (migration 0006). Doing the fan-out from here meant the client held a
    // list of every follower id and wrote a notification row per follower —
    // a loop anyone could replay against any account to spam its followers.
    // The trigger also respects each recipient's notification settings and
    // block list, which this loop never checked.
    setCrt(false);setPst(true);setTimeout(()=>setPst(false),2500);

      if(existing>=0){

        setActiveMsgIdx(existing);
      }else{
        const newThread={id:Date.now(),wu:gU(sellerId),ref:{b:listEyebrow(L),m:listTitle(L),p:buyPrice,id:L.id},isM:false,unread:0,time:'Now',dealStatus:'negotiating',last:`Buy Now request: $${buyPrice}`,cv:[buyCard]};

    if(cErr){console.error('conv create',cErr);showError('Could not start that conversation. Check your connection and try again.');return;}
    const payload={amount:buyPrice,listingRef:{b:listEyebrow(L),m:listTitle(L),p:buyPrice},status:'pending'};

    if(mErr){console.error('buynow msg',mErr);showError('That didn\'t go through. Your offer was not sent — try again.');return;}
    await sb.from('offers').insert({conversation_id:convId,message_id:msgRow.id,listing_id:L.id,offerer_id:me.id,amount:buyPrice,kind:'buynow'});
