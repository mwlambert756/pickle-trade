// Haversine distance in miles
function haversineMi(lat1,lng1,lat2,lng2){
  if(lat1==null||lng1==null||lat2==null||lng2==null)return null;
  const toRad=d=>d*Math.PI/180;
  const R=3958.8;
  const dLat=toRad(lat2-lat1),dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function timeAgo(ts){
  if(!ts)return '—';
  const d=(Date.now()-new Date(ts).getTime())/1000;
  if(d<3600)return Math.max(1,Math.floor(d/60))+'m';
  if(d<86400)return Math.floor(d/3600)+'h';
  if(d<604800)return Math.floor(d/86400)+'d';
  if(d<2592000)return Math.floor(d/604800)+'w';
  return Math.floor(d/2592000)+'mo';
}

function fmtMsgTime(ts){
  if(!ts)return '';
  const d=new Date(ts);
  const now=new Date();
  const sameDay=d.toDateString()===now.toDateString();
  if(sameDay)return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  const yest=new Date(now);yest.setDate(yest.getDate()-1);
  if(d.toDateString()===yest.toDateString())return 'Yest';
  return d.toLocaleDateString([],{month:'short',day:'numeric'});
}
function mapMessageRow(m,meId){
  const isMine=m.sender_id===meId;
  const base={f:isMine?'m':'o',t:fmtMsgTime(m.created_at),id:m.id};
  const p=m.payload||{};
  if(m.kind==='text')return{...base,kind:'text',msg:m.body||''};
  if(m.kind==='offer'||m.kind==='buynow'||m.kind==='counter')
    return{...base,kind:m.kind,amount:p.amount,listingRef:p.listingRef||{},status:p.status||'pending'};
  if(m.kind==='accept')return{...base,kind:'accept',amount:p.amount,listingRef:p.listingRef||{}};
  if(m.kind==='decline')return{...base,kind:'decline',amount:p.amount,listingRef:p.listingRef||{}};
  if(m.kind==='payment')return{...base,kind:'payment',amount:p.amount,method:p.method,handle:p.handle};
  if(m.kind==='system')return{...base,kind:'text',msg:m.body||'[system]'};
  return{...base,kind:'text',msg:m.body||''};
}

function AuthScreen({onSignedIn}){
  const [mode,setMode]=useState('signin');
  const [email,setEmail]=useState('');
  const [pw,setPw]=useState('');
  const [name,setName]=useState('');
  const [err,setErr]=useState('');
  const [busy,setBusy]=useState(false);
  const googleSignIn=async()=>{
    setErr('');setBusy(true);
    try{
      const {error}=await sb.auth.signInWithOAuth({
        provider:'google',
        options:{redirectTo:window.location.origin+window.location.pathname}
      });
      if(error)throw error;
      // Browser will redirect to Google; onAuthStateChange handles the return.
    }catch(ex){
      setErr(ex.message||'Google sign-in failed');
      setBusy(false);
    }
  };
  const submit=async()=>{
    setErr('');setBusy(true);
    // Quick ping to confirm Supabase is reachable before full auth call
    try{await fetch(`${SUPABASE_URL}/auth/v1/settings`,{headers:{'apikey':SUPABASE_KEY}});}
    catch(netErr){
      setErr('Cannot reach Supabase. If you\'re viewing this inside the Claude artifact viewer, download the file and open it in a new browser tab instead.');
      setBusy(false);return;
    }
    try{
      if(mode==='signup'){
        const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{name:name||email.split('@')[0]}}});
        if(error)throw error;
        // Supabase returns a user but no session when email confirmation is ON
        if(data?.user&&!data?.session){
          setErr('');
          setBusy(false);
          setMode('confirm');
          return;
        }
      }else{
        const {error}=await sb.auth.signInWithPassword({email,password:pw});
        if(error)throw error;
      }
      onSignedIn&&onSignedIn();
    }catch(ex){
      const msg=ex.message||'Failed';
      if(msg.toLowerCase().includes('fetch')){
        setErr('Network error — try downloading the file and opening it directly in your browser.');
      }else if(msg.toLowerCase().includes('confirm')||msg.toLowerCase().includes('not confirmed')){
        setErr('Check your email for a confirmation link, then sign in.');
      }else{
        setErr(msg);
      }
    }
    setBusy(false);
  };
  const IS={width:'100%',padding:'12px 14px',background:C.cd,border:`1px solid ${C.bd}`,borderRadius:11,color:C.tx,fontSize:13,outline:'none',marginBottom:10};
  if(mode==='confirm')return e('div',{style:{flex:1,display:'flex',flexDirection:'column',justifyContent:'center',padding:'0 22px',background:C.bg,textAlign:'center'}},[
    e('div',{style:{fontSize:40,marginBottom:16}},'📬'),
    e('div',{style:{fontSize:18,fontWeight:800,color:C.tx,marginBottom:8}},'Check your email'),
    e('div',{style:{fontSize:12,color:C.mt,lineHeight:1.6,marginBottom:24}},`We sent a confirmation link to ${email}. Click it, then come back and sign in.\n\nAlternatively, go to your Supabase dashboard → Auth → Email → turn off "Confirm email" to skip this step.`),
    e('button',{onClick:()=>setMode('signin'),style:{padding:'12px 0',borderRadius:11,background:C.lm,border:'none',cursor:'pointer',fontSize:13,fontWeight:800,color:'#fff'}},'Go to Sign In'),
  ]);
  return e('div',{style:{flex:1,display:'flex',flexDirection:'column',justifyContent:'center',padding:'0 22px',background:C.bg}},[
    e('div',{key:'lg',style:{textAlign:'center',marginBottom:24}},[
      e('div',{style:{fontSize:32,marginBottom:8}},'🏓'),
      e('div',{style:{fontSize:22,fontWeight:900,color:C.lm,letterSpacing:-.5}},'DINK EXCHANGE'),
      e('div',{style:{fontSize:11,color:C.mt,marginTop:4}},mode==='signin'?'Welcome back':'Join your local paddle community'),
    ]),
    e('button',{key:'gg',onClick:googleSignIn,disabled:busy,style:{width:'100%',padding:'12px 0',borderRadius:11,background:'#fff',border:`1px solid ${C.bd}`,cursor:busy?'default':'pointer',fontSize:13,fontWeight:700,color:C.tx,marginBottom:14,display:'flex',alignItems:'center',justifyContent:'center',gap:9}},[
      e('svg',{key:'gi',width:17,height:17,viewBox:'0 0 18 18'},[
        e('path',{key:'p1',fill:'#4285F4',d:'M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.71-1.57 2.68-3.88 2.68-6.62z'}),
        e('path',{key:'p2',fill:'#34A853',d:'M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z'}),
        e('path',{key:'p3',fill:'#FBBC05',d:'M3.97 10.72A5.4 5.4 0 0 1 3.69 9c0-.6.1-1.18.28-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.05l3.01-2.33z'}),
        e('path',{key:'p4',fill:'#EA4335',d:'M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.59C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95L3.97 7.28C4.68 5.16 6.66 3.58 9 3.58z'}),
      ]),
      busy?'Connecting...':'Continue with Google',
    ]),
    e('div',{key:'dv',style:{display:'flex',alignItems:'center',gap:10,marginBottom:14}},[
      e('div',{style:{flex:1,height:1,background:C.dm}}),
      e('div',{style:{fontSize:10,color:C.mt,fontWeight:600}},'or use email'),
      e('div',{style:{flex:1,height:1,background:C.dm}}),
    ]),
    mode==='signup'&&e('input',{key:'nm',value:name,onChange:ev=>setName(ev.target.value),placeholder:'Display name',style:IS}),
    e('input',{key:'em',value:email,onChange:ev=>setEmail(ev.target.value),placeholder:'Email',type:'email',autoCapitalize:'none',style:IS}),
    e('input',{key:'pw',value:pw,onChange:ev=>setPw(ev.target.value),placeholder:'Password',type:'password',style:IS,onKeyDown:ev=>ev.key==='Enter'&&submit()}),

    e('button',{key:'go',onClick:submit,disabled:busy||!email||!pw,style:{width:'100%',padding:'13px 0',borderRadius:11,background:(busy||!email||!pw)?C.dm:C.cta,border:'none',cursor:busy?'default':'pointer',fontSize:14,fontWeight:800,color:'#fff',marginBottom:12}},busy?'...':mode==='signin'?'Sign In':'Create Account'),
    e('button',{key:'tg',onClick:()=>{setMode(m=>m==='signin'?'signup':'signin');setErr('');},style:{background:'none',border:'none',color:C.mt,fontSize:11,cursor:'pointer'}},mode==='signin'?'New here? Create an account':'Already have an account? Sign in'),

function App(){
  const [authState,setAuthState]=useState('loading');
  const [me,setMe]=useState(null);
  const [tab,setTab]=useState('feed');
  const [view,setView]=useState(null);
  const [saved,setSaved]=useState([1,2,4,6,8]);
  const [savedMeta,setSavedMeta]=useState({}); // listing_id -> {prev_price, created_at}
  const [crt,setCrt]=useState(false);
  const [pst,setPst]=useState(false);
  const [matchOpen,setMatchOpen]=useState(false);
  const [notifOpen,setNotifOpen]=useState(false);
  const [savedOpen,setSavedOpen]=useState(false);
  const [settingsOpen,setSettingsOpen]=useState(false);
  const [offerOpen,setOfferOpen]=useState(null);
  const [locMode,setLocMode]=useState('local');
  const [marketCat,setMarketCat]=useState('All');
  const [marketFilters,setMarketFilters]=useState({...initFilters});
  const [msgs,setMsgs]=useState([...MSGS_INIT]);
  const [activeMsgIdx,setActiveMsgIdx]=useState(null);
  const demoUserList=(ids)=>ids.map(id=>US.find(u=>u.id===id)).filter(Boolean);
  const [following,setFollowing]=useState([1,4,6]); // user ids I follow (demo seed)
  const [followers,setFollowers]=useState(demoUserList([...(FOLLOW_GRAPH[0]||[])])); // who follows me
  const [followingUsers,setFollowingUsers]=useState(demoUserList([1,4,6])); // profiles I follow

  // Keep module-level follow state in sync for LCard / helpers
  useEffect(()=>{FOLLOWING=new Set(following);},[following]);
  useEffect(()=>{FOLLOW_GRAPH[0]=new Set((followers||[]).map(u=>u.id));},[followers]);
  const [settings,setSettings]=useState({name:ME.name,location:ME.loc,skill:ME.skill,cashapp:ME.cashapp,venmo:ME.venmo,notifWishlist:true,notifPriceDrops:true,notifTrades:true,notifMessages:true,preciseLoc:false,blockedCt:0});

  // --- AUTH + PROFILE LOAD ---
  const loadProfile=useCallback(async(userId)=>{
    const {data:prof}=await sb.from('profiles').select('*').eq('id',userId).maybeSingle();
    const {data:us}=await sb.from('user_settings').select('*').eq('user_id',userId).maybeSingle();
    if(prof){
      const meObj={
        id:prof.id,name:prof.name||'Player',ini:prof.initials||'??',
        vfd:!!prof.verified,loc:prof.location||'—',skill:prof.skill||'—',
        since:prof.created_at?new Date(prof.created_at).getFullYear().toString():'—',
        resp:prof.response_time||'—',sales:prof.sales_count||0,bio:prof.bio||'',
        ac:prof.avatar_color||'#4DA8FF',bdg:prof.badges||[],
        cashapp:prof.cashapp||'',venmo:prof.venmo||'',
        rating:prof.rating||0,rev:prof.review_count||0,trust:prof.trust_score||50,
        lat:prof.lat,lng:prof.lng,
      };
      setMe(meObj);
      if(us){
        setSettings({
          name:meObj.name,location:meObj.loc,skill:meObj.skill,
          cashapp:meObj.cashapp,venmo:meObj.venmo,
          notifWishlist:us.notif_wishlist,notifPriceDrops:us.notif_price_drops,
          notifTrades:us.notif_trades,notifMessages:us.notif_messages,
          preciseLoc:us.precise_location,blockedCt:0,searchRadius:us.search_radius_mi||25,
        });
      }
    }
  },[]);

  useEffect(()=>{
    let mounted=true;
    sb.auth.getSession().then(async({data:{session}})=>{
      if(!mounted)return;
      if(session?.user){await loadProfile(session.user.id);setAuthState('in');}
      else setAuthState('out');
    });
    const {data:{subscription}}=sb.auth.onAuthStateChange(async(_evt,session)=>{
      if(!mounted)return;
      if(session?.user){await loadProfile(session.user.id);setAuthState('in');}
      else{setMe(null);setAuthState('out');}
    });
    return()=>{mounted=false;subscription.unsubscribe();};
  },[loadProfile]);

  const signOut=async()=>{await sb.auth.signOut();};

  // --- LISTINGS FETCH ---
  const [dataVer,setDataVer]=useState(0);
  const [dataLoading,setDataLoading]=useState(false);
  const fetchListings=useCallback(async()=>{
    if(!me)return;
    setDataLoading(true);
    const meLL=(me.lat!=null&&me.lng!=null)?{lat:Number(me.lat),lng:Number(me.lng)}:null;
    // Active listings with seller + paddle spec
    const {data:rows,error}=await sb
      .from('listings')
      .select('*, seller:profiles!seller_id(*), paddle_spec:paddle_specs(*), photos:listing_photos(url,position)')
      .neq('status','deleted')
      .order('created_at',{ascending:false})
      .limit(200);
    if(error){console.error('listings fetch',error);setDataLoading(false);return;}
    if(!rows||rows.length===0){
      // No real listings yet — keep the demo data visible
      setDataLoading(false);setDataVer(v=>v+1);return;
    }
    // Build users map from sellers
    const usersMap=new Map();
    (rows||[]).forEach(r=>{if(r.seller&&!usersMap.has(r.seller.id))usersMap.set(r.seller.id,profileToUser(r.seller));});
    // Attach distance to each user
    if(meLL){
      for(const u of usersMap.values()){
        if(u.lat!=null&&u.lng!=null){
          const d=haversineMi(meLL.lat,meLL.lng,u.lat,u.lng);
          if(d!=null)u.dist=Math.round(d*10)/10;
        }
      }
    }
    US.length=0;usersMap.forEach(u=>US.push(u));
    // Map listings
    const active=[],sold=[];
    (rows||[]).forEach(r=>{
      const L=mapListingRow(r,meLL);
      if(r.status==='sold')sold.push(L);else active.push(L);
    });
    LS.length=0;active.forEach(l=>LS.push(l));
    SOLD.length=0;sold.slice(0,8).forEach(s=>SOLD.push({
      id:s.id,brand:s.brand,model:s.model,
      price:s.sold_price?Number(s.sold_price):s.price,
      orig:s.orig||s.price,dist:s.dist,ago:s.sold_at?timeAgo(s.sold_at):s.ago,loc:s.loc,
    }));
    setDataLoading(false);
    setDataVer(v=>v+1);
  },[me]);

  useEffect(()=>{if(me)fetchListings();},[me,fetchListings]);

  // --- CONVERSATIONS FETCH ---
  const fetchConversations=useCallback(async()=>{
    if(!me?.id)return;
    const {data:rows,error}=await sb
      .from('conversations')
      .select(`*,
        buyer_profile:profiles!buyer_id(*),
        seller_profile:profiles!seller_id(*),
        listing:listings(id,brand,model,price,type),
        messages(id,conversation_id,sender_id,kind,body,payload,read_at,created_at)
      `)
      .or(`buyer_id.eq.${me.id},seller_id.eq.${me.id}`)
      .order('last_message_at',{ascending:false})
      .limit(50);
    if(error){console.error('convs fetch',error);return;}
    if(!rows||rows.length===0)return; // keep demo data
    // Sort messages within each conversation
    rows.forEach(r=>{if(r.messages)r.messages.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));});
    setMsgs(rows.map(r=>mapConversation(r,me.id)));
  },[me]);

  useEffect(()=>{if(me)fetchConversations();},[me,fetchConversations]);

  // --- NOTIFICATIONS ---
  const [notifs,setNotifs]=useState([...NOTIFS]);
  const TYPE_ICONS={wishlist:'🔥',message:'💬',trade:'🔄',pricedrop:'💰',offer:'💰',follow:'👥',newlisting:'🆕'};
  const mapNotif=(n)=>({
    id:n.id,type:n.type,ic:n.icon||TYPE_ICONS[n.type]||'🔔',
    title:n.title,msg:n.message,time:timeAgo(n.created_at),
    unread:!n.read,listingId:n.listing_id,detail:n.payload?.detail,
    raw:n,
  });
  const fetchNotifications=useCallback(async()=>{
    if(!me?.id)return;
    const {data}=await sb.from('notifications').select('*').eq('user_id',me.id).order('created_at',{ascending:false}).limit(50);
    if(data&&data.length>0)setNotifs(data.map(mapNotif));
  },[me]);
  useEffect(()=>{if(me)fetchNotifications();},[me,fetchNotifications]);
  const markNotifRead=async(id)=>{
    setNotifs(ns=>ns.map(n=>n.id===id?{...n,unread:false}:n));
    if(typeof id==='string'&&me?.id)await sb.from('notifications').update({read:true}).eq('id',id).eq('user_id',me.id);
  };

  // --- FOLLOWS ---
  const fetchFollows=useCallback(async()=>{
    if(!me?.id)return;
    // Who I follow
    const {data:fRows}=await sb.from('follows')
      .select('following_id, followed:profiles!following_id(*)')
      .eq('follower_id',me.id);
    // Who follows me
    const {data:rRows}=await sb.from('follows')
      .select('follower_id, follower:profiles!follower_id(*)')
      .eq('following_id',me.id);
    if(fRows&&fRows.length>0){
      setFollowing(fRows.map(r=>r.following_id));
      setFollowingUsers(fRows.filter(r=>r.followed).map(r=>profileToUser(r.followed)));
    }
    if(rRows&&rRows.length>0){
      setFollowers(rRows.filter(r=>r.follower).map(r=>profileToUser(r.follower)));
    }
  },[me]);
  useEffect(()=>{if(me)fetchFollows();},[me,fetchFollows]);

  const toggleFollow=async(userId)=>{
    if(!userId||userId===me?.id)return;
    const isF=following.includes(userId);
    // Optimistic update
    setFollowing(f=>isF?f.filter(x=>x!==userId):[...f,userId]);
    // Keep the Following list in sync for demo (integer) users
    if(typeof userId==='number'){
      if(isF)setFollowingUsers(us=>us.filter(u=>u.id!==userId));
      else{const du=US.find(u=>u.id===userId);if(du)setFollowingUsers(us=>us.some(u=>u.id===userId)?us:[du,...us]);}
      return;
    }
    // Real DB write only for UUID users + signed-in real profile
    if(typeof userId==='string'&&userId.length>=32&&me?.id){
      if(isF){
        await sb.from('follows').delete().eq('follower_id',me.id).eq('following_id',userId);
        setFollowingUsers(us=>us.filter(u=>u.id!==userId));
      }else{
        await sb.from('follows').insert({follower_id:me.id,following_id:userId});
        // Notify the followed user
        await sb.from('notifications').insert({
          user_id:userId,type:'follow',title:'New follower',
          message:`${me.name} started following you`,
          payload:{detail:'Tap to view their profile',follower_id:me.id},
        });
        const {data:prof}=await sb.from('profiles').select('*').eq('id',userId).maybeSingle();
        if(prof)setFollowingUsers(us=>[profileToUser(prof),...us]);
      }
    }
  };

  // --- REALTIME SUBSCRIPTIONS ---
  useEffect(()=>{
    if(!me?.id)return;
    const ch=sb.channel('user-'+me.id)
      // New messages: refresh conversations
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},()=>{
        fetchConversations();
      })
      // Offer status changes: refresh
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'offers'},()=>{
        fetchConversations();
      })
      // Conversation deal_status changes (e.g. other party accepted)
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'conversations'},()=>{
        fetchConversations();
      })
      // New notifications for me
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:`user_id=eq.${me.id}`},(payload)=>{
        const n=mapNotif(payload.new);
        setNotifs(ns=>[n,...ns]);
        if(payload.new?.type==='follow')fetchFollows();
      })
      .subscribe();
    return()=>{sb.removeChannel(ch);};
  },[me,fetchConversations]);

  const togSv=async(id)=>{
    // For demo (integer ids), just toggle locally
    if(typeof id==='number'){setSaved(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);return;}
    if(!me?.id)return;
    if(saved.includes(id)){
      setSaved(s=>s.filter(x=>x!==id));
      await sb.from('saved_listings').delete().eq('user_id',me.id).eq('listing_id',id);
    }else{
      setSaved(s=>[...s,id]);
      const {data}=await sb.from('saved_listings').insert({user_id:me.id,listing_id:id}).select().single();
      if(data)setSavedMeta(m=>({...m,[id]:{prev_price:data.prev_price,created_at:data.created_at}}));
    }
  };

  // Fetch saved listings (DB) when me is loaded
  useEffect(()=>{
    if(!me?.id)return;
    let mounted=true;
    sb.from('saved_listings').select('listing_id, prev_price, created_at').eq('user_id',me.id).then(({data})=>{
      if(!mounted||!data)return;
      const ids=data.map(r=>r.listing_id);
      const meta={};data.forEach(r=>{meta[r.listing_id]={prev_price:r.prev_price,created_at:r.created_at};});
      // Merge with demo integer ids only if there are no DB rows yet
      if(ids.length>0){setSaved(ids);setSavedMeta(meta);}
    });
    return()=>{mounted=false;};
  },[me]);
  const togLoc=()=>setLocMode(m=>m==='local'?'anywhere':'local');
  const handlePost=async(formData,photoFiles)=>{
    if(!me?.id)return;
    const condMap={'Brand New':10,'Like New':9,'Good':7,'Fair':5,'Heavy Use':3};
    // Look up paddle_spec id if paddle
    let specId=null;
    if(formData.cat==='paddle'){
      const {data:spec}=await sb.from('paddle_specs').select('id').eq('brand',formData.brand).eq('model',formData.model).maybeSingle();
      if(spec)specId=spec.id;
    }
    const row={
      seller_id:me.id,
      category:formData.cat,
      brand:formData.brand,
      model:formData.model,
      price:Number(formData.price)||0,
      condition:condMap[formData.cond]||7,
      type:formData.willTrade?'both':'sale',
      description:formData.desc,
      location:me.loc||'',
      lat:me.lat,lng:me.lng,
      paddle_spec_id:specId,
      tag:'NEW',
    };
    const {data:listing,error}=await sb.from('listings').insert(row).select().single();
    if(error){console.error('insert listing',error);return;}
    // Upload photos to storage and insert listing_photos rows
    if(photoFiles&&photoFiles.length>0&&listing){
      const photoRows=[];
      for(let i=0;i<photoFiles.length;i++){
        const file=photoFiles[i];
        const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
        const path=`${me.id}/${listing.id}/${i}.${ext}`;
        const {error:upErr}=await sb.storage.from('listing-photos').upload(path,file,{cacheControl:'3600',upsert:true,contentType:file.type});
        if(upErr){console.error('photo upload',upErr);continue;}
        const {data:pub}=sb.storage.from('listing-photos').getPublicUrl(path);
        photoRows.push({listing_id:listing.id,url:pub.publicUrl,position:i});
      }
      if(photoRows.length>0){
        const {error:photoErr}=await sb.from('listing_photos').insert(photoRows);
        if(photoErr)console.error('photo rows insert',photoErr);
      }
    }
    // Notify everyone who follows me about the new listing
    if(listing){
      const {data:myFollowers}=await sb.from('follows').select('follower_id').eq('following_id',me.id);
      if(myFollowers&&myFollowers.length>0){
        const notifRows=myFollowers.map(f=>({
          user_id:f.follower_id,type:'newlisting',
          title:`${me.name} listed a new item`,
          message:`${formData.brand} ${formData.model} — $${formData.price}`,
          listing_id:listing.id,payload:{detail:'Tap to view the listing'},
        }));
        await sb.from('notifications').insert(notifRows);
      }
    }
    setCrt(false);setPst(true);setTimeout(()=>setPst(false),2500);
    fetchListings();
  };
  const goCat=(c)=>{setMarketCat(c);setMarketFilters({...initFilters});setTab('market');setView(null);};
  const goBrand=(b)=>{setMarketCat('All');setMarketFilters({...initFilters,brands:[b]});setTab('market');setView(null);};

  // Buy Now flow — auto-message in chat
  // Buy Now / Make Offer — write to DB when seller is a real UUID; otherwise demo flow
  const isUuid=(v)=>typeof v==='string'&&v.length>=32;
  const initBuyNow=async(L)=>{
    const sellerId=L.sid;
    if(!isUuid(sellerId)||!me?.id||!isUuid(L.id)){
      // Demo fallback
      const existing=msgs.findIndex(m=>m.wu.id===sellerId);
      const buyCard={f:'m',kind:'buynow',amount:L.price,listingRef:{b:L.brand,m:L.model,p:L.price},status:'pending',t:'Now'};
      if(existing>=0){
        setMsgs(ms=>ms.map((t,i)=>i!==existing?t:{...t,cv:[...t.cv,buyCard],last:`Buy Now request: $${L.price}`,time:'Now',unread:0}));
        setActiveMsgIdx(existing);
      }else{
        const newThread={id:Date.now(),wu:gU(sellerId),ref:{b:L.brand,m:L.model,p:L.price,id:L.id},isM:false,unread:0,time:'Now',dealStatus:'negotiating',last:`Buy Now request: $${L.price}`,cv:[buyCard]};
        setMsgs([newThread,...msgs]);setActiveMsgIdx(0);
      }
      setTab('messages');setView(null);return;
    }
    // Real flow
    const {data:convId,error:cErr}=await sb.rpc('get_or_create_conversation',{p_listing_id:L.id,p_other_user_id:sellerId});
    if(cErr){console.error('conv create',cErr);return;}
    const payload={amount:L.price,listingRef:{b:L.brand,m:L.model,p:L.price},status:'pending'};
    const {data:msgRow,error:mErr}=await sb.from('messages').insert({conversation_id:convId,sender_id:me.id,kind:'buynow',payload}).select().single();
    if(mErr){console.error('buynow msg',mErr);return;}
    await sb.from('offers').insert({conversation_id:convId,message_id:msgRow.id,listing_id:L.id,offerer_id:me.id,amount:L.price,kind:'buynow'});
    await fetchConversations();
    setTab('messages');setView(null);
    // Activate this conversation
    setTimeout(()=>{setMsgs(ms=>{const i=ms.findIndex(t=>t.id===convId);if(i>=0)setActiveMsgIdx(i);return ms;});},50);
  };

  const initOffer=async(L,amount,note)=>{
    const sellerId=L.sid;
    if(!isUuid(sellerId)||!me?.id||!isUuid(L.id)){
      // Demo fallback
      const existing=msgs.findIndex(m=>m.wu.id===sellerId);
      const offerCard={f:'m',kind:'offer',amount,listingRef:{b:L.brand,m:L.model,p:L.price},status:'pending',t:'Now'};
      const noteCard=note?{f:'m',kind:'text',msg:note,t:'Now'}:null;
      const cards=noteCard?[offerCard,noteCard]:[offerCard];
      if(existing>=0){
        setMsgs(ms=>ms.map((t,i)=>i!==existing?t:{...t,cv:[...t.cv,...cards],last:`Offered $${amount}`,time:'Now',unread:0}));
        setActiveMsgIdx(existing);
      }else{
        const newThread={id:Date.now(),wu:gU(sellerId),ref:{b:L.brand,m:L.model,p:L.price,id:L.id},isM:false,unread:0,time:'Now',dealStatus:'negotiating',last:`Offered $${amount}`,cv:cards};
        setMsgs([newThread,...msgs]);setActiveMsgIdx(0);
      }
      setOfferOpen(null);setTab('messages');setView(null);return;
    }
    // Real flow
    const {data:convId,error:cErr}=await sb.rpc('get_or_create_conversation',{p_listing_id:L.id,p_other_user_id:sellerId});
    if(cErr){console.error('conv create',cErr);return;}
    const payload={amount,listingRef:{b:L.brand,m:L.model,p:L.price},status:'pending'};
    const {data:msgRow,error:mErr}=await sb.from('messages').insert({conversation_id:convId,sender_id:me.id,kind:'offer',payload}).select().single();
    if(mErr){console.error('offer msg',mErr);return;}
    await sb.from('offers').insert({conversation_id:convId,message_id:msgRow.id,listing_id:L.id,offerer_id:me.id,amount,kind:'offer',note:note||null});
    if(note&&note.trim()){
      await sb.from('messages').insert({conversation_id:convId,sender_id:me.id,kind:'text',body:note.trim()});
    }
    await fetchConversations();
    setOfferOpen(null);setTab('messages');setView(null);
    setTimeout(()=>{setMsgs(ms=>{const i=ms.findIndex(t=>t.id===convId);if(i>=0)setActiveMsgIdx(i);return ms;});},50);
  };

  const goMsg=(L)=>{
    const existing=msgs.findIndex(m=>m.wu.id===L.sid);
    if(existing>=0)setActiveMsgIdx(existing);
    setView(null);setTab('messages');
  };

  const TABS=[{id:'feed',ic:'⚡',l:'Discover'},{id:'market',ic:'🏷',l:'Market'},{id:'sell',ic:'+',l:'Sell',center:true},{id:'messages',ic:'💬',l:'Messages'},{id:'profile',ic:'👤',l:'Profile'}];
  const tot=msgs.reduce((a,m)=>a+m.unread,0);
  const notifUnread=notifs.filter(n=>n.unread).length;
  const priceDrop=saved.filter(id=>{
    const L=LS.find(l=>l.id===id);
    const meta=savedMeta&&savedMeta[id];
    return(meta?computeSavedStatus(L,meta):getSavedStatus(id)).type==='pricedrop';
  }).length;
  const handleNav=(id)=>{if(id==='sell'){setCrt(true);setView(null);return;}setTab(id);setView(null);if(id==='messages'&&activeMsgIdx===null);};
  const overlayOpen=crt||matchOpen||notifOpen||savedOpen||settingsOpen||offerOpen;

  // --- AUTH GATE ---
  if(authState==='loading'||authState==='in'&&!me){
    return e('div',{style:{display:'flex',justifyContent:'center',padding:'14px 0',background:'#E5E7EB',minHeight:'100%'}},[
      e('div',{style:{width:380,background:C.bg,borderRadius:34,overflow:'hidden',display:'flex',flexDirection:'column',height:780,boxShadow:`0 20px 60px rgba(31,41,51,0.12), 0 0 0 1px ${C.bd}`,position:'relative'}},[e(LoadingScreen)]),
    ]);
  }
  if(authState==='out'){
    return e('div',{style:{display:'flex',justifyContent:'center',padding:'14px 0',background:'#E5E7EB',minHeight:'100%'}},[
      e('div',{style:{width:380,background:C.bg,borderRadius:34,overflow:'hidden',display:'flex',flexDirection:'column',height:780,boxShadow:`0 20px 60px rgba(31,41,51,0.12), 0 0 0 1px ${C.bd}`,position:'relative'}},[e(AuthScreen)]),
    ]);
  }

  return e('div',{style:{display:'flex',justifyContent:'center',padding:'14px 0',background:'#E5E7EB',minHeight:'100%'}},[
    e('div',{style:{width:380,background:C.bg,borderRadius:34,overflow:'hidden',display:'flex',flexDirection:'column',height:780,boxShadow:`0 20px 60px rgba(31,41,51,0.12), 0 0 0 1px ${C.bd}`,position:'relative'}},[
      e('div',{key:'sb',style:{height:42,background:C.bg,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 18px',borderBottom:`1px solid ${C.dm}`,flexShrink:0}},[
        e('div',{style:{display:'flex',alignItems:'center',gap:6}},[e('span',{style:{fontSize:13,fontWeight:900,color:C.lm,letterSpacing:-.5}},'🏓 DINK'),e('span',{style:{fontSize:7,background:C.lm,color:'#fff',borderRadius:4,padding:'1px 5px',fontWeight:900,letterSpacing:.5}},'EXCHANGE')]),
        e('div',{style:{display:'flex',alignItems:'center',gap:10}},[
          e('span',{style:{fontSize:10,color:C.mt}},`📍 ${locMode==='local'?'Maryville':'Anywhere'}`),
          e('button',{onClick:()=>setSavedOpen(true),style:{background:'transparent',border:'none',cursor:'pointer',position:'relative',padding:0,fontSize:14,color:saved.length>0?C.lm:C.mt,lineHeight:1}},['♥',saved.length>0&&e('span',{style:{position:'absolute',top:-4,right:-5,minWidth:13,height:13,borderRadius:7,background:priceDrop>0?C.lm:C.tl,color:'#fff',fontSize:8,fontWeight:900,display:'flex',alignItems:'center',justifyContent:'center',padding:'0 3px'}},saved.length)]),
          e('button',{onClick:()=>setNotifOpen(true),style:{background:'transparent',border:'none',cursor:'pointer',position:'relative',padding:0,fontSize:14,color:C.lm}},['🔔',notifUnread>0&&e('span',{style:{position:'absolute',top:-3,right:-4,minWidth:14,height:14,borderRadius:7,background:C.rd,color:'#fff',fontSize:8,fontWeight:900,display:'flex',alignItems:'center',justifyContent:'center',padding:'0 3px'}},notifUnread)]),
        ]),
      ]),
      e('div',{key:'mn',style:{flex:1,overflow:'hidden',display:'flex',flexDirection:'column',position:'relative'}},[
        crt&&e(CrtOverlay,{onClose:()=>setCrt(false),onPost:handlePost}),
        matchOpen&&e(MatchOverlay,{onClose:()=>setMatchOpen(false),onChat:()=>setTab('messages')}),
        notifOpen&&e(NotifPanel,{onClose:()=>setNotifOpen(false),onListing:setView,onMsgs:()=>setTab('messages'),onTrade:()=>setMatchOpen(true),notifs,onMarkRead:markNotifRead}),
        savedOpen&&e(SavedOverlay,{onClose:()=>setSavedOpen(false),saved,onSave:togSv,onView:(l)=>{setSavedOpen(false);setView(l);},savedMeta}),
        settingsOpen&&e(SettingsOverlay,{onClose:()=>setSettingsOpen(false),settings,setSettings,onSignOut:signOut,me}),
        offerOpen&&e(OfferOverlay,{L:offerOpen,onClose:()=>setOfferOpen(null),onSubmit:(amt,note)=>initOffer(offerOpen,amt,note)}),
        pst&&e('div',{style:{position:'absolute',top:14,left:0,right:0,display:'flex',justifyContent:'center',zIndex:30}},[e('div',{style:{background:C.ok,color:'#fff',borderRadius:18,padding:'7px 17px',fontSize:12,fontWeight:800,boxShadow:`0 4px 12px ${C.ok}44`}},'🎉 Listing posted!')]),
        !overlayOpen&&[
          view&&e(LDetail,{key:'dt',L:view,onBack:()=>setView(null),onMsg:()=>goMsg(view),onBuyNow:()=>initBuyNow(view),onMakeOffer:()=>setOfferOpen(view),saved:saved.includes(view.id),onSave:togSv,onView:setView,sold:getSavedStatus(view.id).type==='sold',following,onToggleFollow:toggleFollow,meId:me?.id}),
          !view&&tab==='feed'&&e(FeedTab,{key:'fd',onView:setView,saved,onSave:togSv,locMode,onLocToggle:togLoc,onCatSelect:goCat,onBrandSelect:goBrand,onWishPrompt:()=>setTab('profile'),following}),
          !view&&tab==='market'&&e(MarketTab,{key:'mk',onView:setView,saved,onSave:togSv,locMode,onLocToggle:togLoc,cat:marketCat,setCat:setMarketCat,filters:marketFilters,setFilters:setMarketFilters}),
          !view&&tab==='messages'&&e(MsgTab,{key:'ms',msgs,setMsgs,activeIdx:activeMsgIdx,setActiveIdx:setActiveMsgIdx,meId:me?.id,onRefresh:fetchConversations}),
          !view&&tab==='profile'&&e(ProfileTab,{key:'pf',onView:setView,saved,onOpenMatches:()=>setMatchOpen(true),onOpenSaved:()=>setSavedOpen(true),onOpenSettings:()=>setSettingsOpen(true),me,savedMeta,followers,following,followingUsers,onToggleFollow:toggleFollow}),
        ],
      ]),
      !overlayOpen&&!view&&e('div',{key:'nv',style:{height:64,background:C.sf,borderTop:`1px solid ${C.dm}`,display:'flex',alignItems:'center',flexShrink:0}},TABS.map(t=>e('button',{key:t.id,onClick:()=>handleNav(t.id),style:{flex:1,height:'100%',background:'none',border:'none',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:2,cursor:'pointer',position:'relative'}},[
        t.center?e('div',{style:{width:46,height:46,borderRadius:'50%',background:C.cta,display:'flex',alignItems:'center',justifyContent:'center',fontSize:24,fontWeight:900,color:'#fff',marginTop:-14,boxShadow:`0 4px 16px ${C.cta}66`,border:`3px solid ${C.bg}`}},t.ic):[
          e('span',{style:{fontSize:17,opacity:tab===t.id?1:.6}},t.ic),
          e('span',{style:{fontSize:8,color:tab===t.id?C.lm:C.mt,fontWeight:tab===t.id?700:400}},t.l),
          tab===t.id&&e('div',{style:{position:'absolute',bottom:5,width:4,height:4,borderRadius:'50%',background:C.lm}}),
          t.id==='messages'&&tot>0&&e('div',{style:{position:'absolute',top:5,right:'22%',width:14,height:14,borderRadius:'50%',background:C.rd,display:'flex',alignItems:'center',justifyContent:'center',fontSize:8,fontWeight:900,color:'#fff'}},tot),
        ],
      ]))),
    ]),
  ]);
}

ReactDOM.render(e(App),document.getElementById('root'));
</script>
